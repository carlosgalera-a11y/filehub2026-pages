<script>
  // Tema, aplicado antes de pintar. En FileHub manda el del calendario (fh_cal_tema: auto | light | dark);
  // en el Workspace, ws_tema ('claro' u oscuro por defecto). ?tema=claro|oscuro lo fuerza (pruebas).
  (function(){ try {
    var forzado = new URLSearchParams(location.search).get('tema'), claro;
    if (forzado) claro = forzado === 'claro';
    else if (/(^|\.)arditifilehub\.com$/.test(location.hostname)) {
      var pref = localStorage.getItem('fh_cal_tema') || 'auto';
      claro = !(pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches));
    } else claro = localStorage.getItem('ws_tema') === 'claro';
    if (claro) document.documentElement.classList.add('claro');
  } catch(_){} })();
  // Incrustada en la tablet o el calendario: si allí se cambia el tema, se cambia aquí también.
  addEventListener('storage', function (e) {
    if (e.key !== 'fh_cal_tema' || new URLSearchParams(location.search).get('tema')) return;
    var pref = e.newValue || 'auto';
    var claro = !(pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches));
    document.documentElement.classList.toggle('claro', claro);
  });
</script>

function haceCuanto(iso) {
  if (!iso) return '';
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 1) return 'ahora mismo';
  if (min < 60) return `hace ${min} min`;
  if (min < 48 * 60) return `hace ${Math.round(min / 60)} h`;
  return `hace ${Math.round(min / 1440)} días`;
}
function estadoPC() {
  if (!estado.tableroAt) return ['', 'Sin datos del PC todavía'];

// Lo que decides sobre una tarea bloqueada viaja como una fila más de agente_encargos (ver la cabecera). La más reciente
// de cada tarea cuenta mientras espera al PC; ya aplicada, solo un rato y solo si es posterior al bloqueo que enseña el tablero.
function accionDe(t) {
  const desde = ((t.bloqueo && t.bloqueo.desde) || 0) * 1000;
  return estado.acciones.find(a => {
    if (a.tarea !== t.id) return false;
    if (a.estado === 'pendiente') return true;
    const cuando = new Date(a.lanzado_at || a.created_at).getTime();
    return cuando > desde && Date.now() - cuando < 15 * 60000;
  });
}
// 'pregunta' (el agente espera tu respuesta), 'fallo' (el tablero se rindió) o 'sin-datos' (el PC aún no ha dicho por qué).
function tipoBloqueo(t) { return t.estado !== 'blocked' ? null : (t.bloqueo && t.bloqueo.tipo) || 'sin-datos'; }
function chipTarea(t) {
  const tb = tipoBloqueo(t);
  if (tb === 'pregunta') return ['espera tu respuesta', 'ambar'];
  if (tb === 'fallo') return ['atascada por un fallo', 'rojo'];
  return ESTADO_TAREA[t.estado] || [t.estado || '?', ''];
}
function guardaBorradores() {
  document.querySelectorAll('textarea[data-resp]').forEach(x => { estado.borradores[x.dataset.resp] = x.value; });
}

async function cargar() {
  // Los datos de ejemplo se ponen una sola vez: así lo que pruebes (encargar, borrar un resultado) no se deshace al refrescar.
  if (DEMO) { if (!estado.demoListo) { datosDemo(); estado.demoListo = true; } estado.cargando = false; return; }
  const [tab, enc, res] = await Promise.all([
    sb.from('panel_tablet').select('contenido,generado_at,updated_at').eq('tipo', 'tablero').order('fecha', { ascending: false }).limit(1),
    sb.from('agente_encargos').select('id,agente,titulo,estado,kanban_id,error,origen,created_at,lanzado_at').order('created_at', { ascending: false }).limit(60),
    sb.from(TABLA_RESULTADOS).select('id,tarea,tarea_titulo,agente,nombre,ruta,tipo,tamano,origen,created_at,updated_at').order('created_at', { ascending: false }).limit(400),
  ]);
  // Si la tabla de resultados aún no existe o falla, lo dice su pestaña; el resto de la página sigue igual.
  if (res.error) {
    const falta = res.error.code === 'PGRST205' || res.error.code === '42P01' || /does not exist|schema cache/i.test(res.error.message || '');
    estado.falloResultados = falta ? 'Los resultados todavía no están activados en la base de datos. En cuanto lo estén, aparecerán aquí.'
      : 'No he podido leer los resultados: ' + res.error.message;
    estado.resultados = [];
  } else { estado.falloResultados = null; estado.resultados = res.data || []; }
  if (tab.error) estado.falloTablero = tab.error.message; else {
    estado.falloTablero = null;
    const fila = (tab.data || [])[0];
    estado.tareas = (fila && fila.contenido && fila.contenido.tareas) || [];
    estado.tableroAt = fila ? (fila.updated_at || fila.generado_at) : null;
  }
  if (enc.error) estado.aviso = ['mal', 'No he podido leer tus encargos: ' + enc.error.message];
  else {
    const filas = enc.data || [];
    estado.acciones = filas.map(e => { const m = /^accion:([a-z]+):(t_[0-9a-f]+)/.exec(e.origen || ''); return m && { ...e, tipo: m[1], tarea: m[2] }; }).filter(Boolean);
    estado.encargos = filas.filter(e => !(e.origen || '').startsWith('accion:')).slice(0, 30);
  }
  estado.cargando = false;
}

function claseArchivo(r) {

function tamanoLegible(n) {
  n = Number(n) || 0;
  if (n < 1024) return `${n} B`;
  if (n < 1048576) return `${Math.round(n / 1024)} KB`;
  if (n < 1073741824) return `${(n / 1048576).toLocaleString('es-ES', { maximumFractionDigits: 1 })} MB`;
  return `${(n / 1073741824).toLocaleString('es-ES', { maximumFractionDigits: 2 })} GB`;
}
const llano = s => String(s || '').toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');  // sin mayúsculas ni acentos, para buscar

    if (act === 'res-borrar-si') {
      const quita = await sb.storage.from(ALMACEN).remove([r.ruta]);
      fallo = quita.error ? quita.error.message : null;
      if (!fallo) { const fila = await sb.from(TABLA_RESULTADOS).delete().eq('id', r.id); fallo = fila.error ? fila.error.message : null; }
      if (!fallo) { delete estado.audio[r.id]; delete estado.enlace[r.id]; estado.aviso = ['ok', `«${r.nombre}» borrado.`]; }
      estado.resConfirma = null;
    } else {
      const e2 = await enlaceFirmado(r, act === 'res-bajar');
      fallo = e2.error || null;
      if (fallo) { if (ventana) ventana.close(); }
      else if (act === 'res-oir') estado.audio[r.id] = e2.url;
      else if (act === 'res-abrir') {
        if (ventana) { try { ventana.opener = null; } catch (_) {} ventana.location.replace(e2.url); delete estado.enlace[r.id]; }
        else estado.enlace[r.id] = e2.url;  // ventana bloqueada: queda el enlace a la vista para abrirlo a mano
      } else {
        const a = document.createElement('a'); a.href = e2.url; a.rel = 'noopener'; a.download = r.nombre;
        document.body.appendChild(a); a.click(); a.remove();
      }
    }
    estado.resOcupado = null;
    if (fallo) estado.aviso = ['mal', (act === 'res-borrar-si' ? 'No se ha podido borrar: ' : 'No se ha podido preparar el archivo: ') + fallo];
    if (act === 'res-borrar-si' && !fallo) await cargar();
    pinta();
    if (act === 'res-oir' && !fallo) { const au = [...document.querySelectorAll('audio[data-res]')].find(n => n.dataset.res === String(r.id)); if (au) au.play().catch(() => {}); }
  }
  if (act === 'recargar') { b.disabled = true; await cargar(); estado.aviso = null; pinta(); }
  if (act === 'filtro') { estado.filtro = (id && estado.filtro !== id) ? id : null; pinta(); }
  if (act === 'idea') {
    const i = IDEAS[Number(id)]; if (!i) return;
    pinta();
    document.getElementById('agente').value = i.agente;
    document.getElementById('titulo').value = ('Prototipo con eve: ' + i.titulo).slice(0, 300);
    document.getElementById('detalle').value = `${i.texto}\n\n${BASE_EVE}`;
    document.getElementById('titulo').focus(); document.getElementById('t-encargar').scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  if (act === 'cancelar') {
    b.disabled = true;
    if (DEMO) { estado.encargos = estado.encargos.filter(x => x.id !== id); estado.acciones = estado.acciones.filter(x => x.id !== id); }
    else {
      const { error } = await sb.from('agente_encargos').delete().eq('id', id).eq('estado', 'pendiente');
      estado.aviso = error ? ['mal', 'No se ha podido cancelar: ' + error.message] : ['ok', 'Cancelado.'];
      await cargar();
    }
    pinta();
  }
});

(async function arranque() {
  try {
    if (!DEMO) {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        const donde = EN_FILEHUB ? '<a href="./calendario.html" target="_top">calendario</a>' : '<a href="./" target="_top">Workspace</a>';
        $raiz.innerHTML = `<div class="centro"><div><h1>Centro de agentes</h1><p style="margin-top:8px">Inicia sesión en el ${donde} y vuelve a esta pestaña.</p></div></div>`; return;
      }
      if (session.user.id !== OWNER_UID && (session.user.email || '').toLowerCase() !== OWNER_EMAIL) { $raiz.innerHTML = `<div class="centro"><p>Esta página es solo para Carlos.</p></div>`; return; }
    }
    await cargar(); pinta();
    // Refresco cada minuto, salvo si la pestaña está oculta, estás escribiendo un encargo, una respuesta o una búsqueda
    // (repintar quita el foco), hay un archivo a medio preparar o suena un audio.
    setInterval(async () => {
      const a = document.activeElement;
      const suena = [...document.querySelectorAll('audio[data-res]')].some(x => !x.paused);
      if (document.hidden || estado.enviando || estado.accionando || estado.resOcupado || estado.resConfirma || suena || voz.quiere
        || (a && a.closest && a.closest('#form, textarea[data-resp], #res-busca'))) return;
      await cargar(); pinta();
    }, 60000);
  } catch (e) {
    $raiz.innerHTML = `<div class="centro"><div><p>No se pudo cargar.</p><p class="nota" style="margin-top:6px">${esc(String(e && e.message || e))}</p></div></div>`;
  }
})();
</script>
