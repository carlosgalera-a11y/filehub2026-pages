<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>Panel · FileHub</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-calendario-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-calendario-180.png">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest-tablet.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Mismo tema que calendario.html (fh_cal_tema, compartido en este dominio): se
  // aplica antes de pintar para no ver un fogonazo blanco al abrir en oscuro.
  (function () {
    var pref = localStorage.getItem('fh_cal_tema') || 'auto';
    var oscuro = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.tema = oscuro ? 'dark' : 'light';
    // ?solo=resumen | viajes | vuelos → una sola vista, sin cabecera ni lateral (incrustada en calendario.html).
    var solo = new URLSearchParams(location.search).get('solo');
    if (solo === 'resumen' || solo === 'viajes' || solo === 'vuelos') document.documentElement.classList.add('solo');
  })();
</script>
<style>
  /* Panel fijo para la tablet (horizontal, ~1280×800). Tokens = calendario.html. */
  :root {
    --ink: #0f172a; --muted: #64748b; --soft: #94a3b8;
    --line: #e5e9f2; --bg: #f4f6fa; --card: #ffffff;
    --indigo: #4f46e5; --indigo-soft: #eef2ff; --indigo-ring: #4f46e51a;
    --shadow: 0 1px 2px rgba(15,23,42,.05), 0 4px 14px rgba(15,23,42,.05);
    --radius: 14px;
    --seg-bg: #e9edf5; --seg-on: #ffffff;
    --overlay: #0f172a59; --sheet-shadow: 0 -8px 30px #00000033;
    --aviso-bg: #fffbeb; --aviso-line: #fde68a; --aviso-fg: #92400e;
    --atr-fecha: #dc2626;
    --tarea: #0ea5e9; --montse: #db2777;
    --t-urg-bg: #dc2626; --t-urg-fg: #ffffff;
    --t-agm-bg: #16a34a; --t-agm-fg: #ffffff;
    --t-agt-bg: #2563eb; --t-agt-fg: #ffffff;
    --t-egs-bg: #facc15; --t-egs-fg: #4a3403;
    --ev-personal-bg: #e0e7ff; --ev-personal-fg: #4338ca; --ev-personal-dot: #6366f1;
    --ev-work-bg: #fef3c7;     --ev-work-fg: #b45309;     --ev-work-dot: #f59e0b;
    --ev-fitness-bg: #d1fae5;  --ev-fitness-fg: #047857;  --ev-fitness-dot: #10b981;
    --ev-trip-bg: #cffafe;     --ev-trip-fg: #0e7490;     --ev-trip-dot: #06b6d4;
    --ev-guardia-bg: #fee2e2;  --ev-guardia-fg: #b91c1c;  --ev-guardia-dot: #ef4444;
    --prio-high: #ef4444; --prio-medium: #f59e0b; --prio-low: #94a3b8;
    /* Fuentes de las tareas */
    --src-fh: #4f46e5; --src-fh-bg: #eef2ff;
    --src-egs: #0d9488; --src-egs-bg: #ccfbf1;
    --src-ag: #7c3aed; --src-ag-bg: #ede9fe;
    --col-bg: #eef1f7;
    /* Áreas de la casa */
    --area-limpieza: #0ea5e9; --area-cocina: #f97316; --area-compra: #10b981; --area-otro: #8b5cf6;
    color-scheme: light;
  }
  html[data-tema="dark"] {
    --ink: #f8fafc; --muted: #94a3b8; --soft: #64748b;
    --line: #283449; --bg: #0b1326; --card: #131b2e;
    --indigo: #8083ff; --indigo-soft: #8083ff26; --indigo-ring: #8083ff2e;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.30);
    --seg-bg: #1b2438; --seg-on: #222a3d;
    --overlay: #020617b3; --sheet-shadow: 0 -8px 30px #00000066;
    --aviso-bg: #3a2c0c; --aviso-line: #6b5312; --aviso-fg: #fcd34d;
    --atr-fecha: #f87171;
    --tarea: #38bdf8; --montse: #f472b6;
    --ev-personal-bg: #232a4d; --ev-personal-fg: #c0c1ff; --ev-personal-dot: #8083ff;
    --ev-work-bg: #3a2c12;     --ev-work-fg: #fcd34d;     --ev-work-dot: #f59e0b;
    --ev-fitness-bg: #10322a;  --ev-fitness-fg: #6ee7b7;  --ev-fitness-dot: #4edea3;
    --ev-trip-bg: #113240;     --ev-trip-fg: #67e8f9;     --ev-trip-dot: #22d3ee;
    --ev-guardia-bg: #3a1c1f;  --ev-guardia-fg: #fca5a5;  --ev-guardia-dot: #f87171;
    --prio-high: #f87171; --prio-medium: #fbbf24; --prio-low: #64748b;
    --src-fh: #8083ff; --src-fh-bg: #8083ff26;
    --src-egs: #2dd4bf; --src-egs-bg: #2dd4bf1f;
    --src-ag: #a78bfa; --src-ag-bg: #a78bfa24;
    --col-bg: #0f1729;
    --area-limpieza: #38bdf8; --area-cocina: #fb923c; --area-compra: #4edea3; --area-otro: #a78bfa;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.4;
    overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3, h4, .reloj b, .num, .stat .n { font-family: 'Hanken Grotesk', 'Inter', sans-serif; }
  button { font-family: inherit; color: inherit; }
  .app {
    height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
  }

  /* ── Cabecera ── */
  .top { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
  .reloj { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .reloj b { font-size: 36px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .reloj span { color: var(--muted); font-weight: 600; font-size: 15px; white-space: nowrap; }
  .turnos-hoy { display: flex; gap: 6px; flex-wrap: wrap; }
  .top .der { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--seg-bg); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button {
    border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px;
    padding: 8px 14px; border-radius: 9px; cursor: pointer;
  }
  .seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
  .btn {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px; min-width: 40px; height: 40px;
    padding: 0 12px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:active, .seg button:active { transform: scale(.97); }
  .nav { display: inline-flex; gap: 6px; }

  /* ── Cuerpo: vista + lateral ── */
  .cuerpo { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; min-height: 0; }
  .vista, .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .vista { display: flex; flex-direction: column; min-height: 0; padding: 12px 12px 10px; }
  .vista-cab { display: flex; align-items: center; gap: 10px; margin: 0 2px 10px; flex-wrap: wrap; }
  .vista-cab h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .chips { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .chips button {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px;
    font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #contenido { flex: 1; min-height: 0; overflow: auto; }
  .lateral { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  .chip-t {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; letter-spacing: .01em;
  }
  .turnos-hoy .chip-t { font-size: 13px; padding: 5px 10px; border-radius: 8px; }
  .vacio { color: var(--soft); font-size: 13px; padding: 6px 2px; }
  .quien { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; font-size: 9px; font-weight: 800; background: var(--indigo-soft); color: var(--indigo); flex: none; }
  .quien.m { background: color-mix(in srgb, var(--montse) 18%, transparent); color: var(--montse); }

  /* ── Mes ── */
  .v-mes { overflow: hidden !important; }
  .mes { display: grid; grid-template-rows: auto repeat(var(--filas), minmax(0, 1fr)); gap: 4px; height: 100%; }
  .mes-dows, .mes-fila { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; min-height: 0; }
  .mes-dows span { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
  .celda {
    border: 1px solid var(--line); border-radius: 10px; padding: 4px 5px; overflow: hidden; min-height: 0;
    display: flex; flex-direction: column; gap: 2px; cursor: pointer;
  }
  .celda.fuera { opacity: .42; }
  .celda.hoy { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); background: var(--indigo-soft); }
  .celda .num { font-size: 13px; font-weight: 800; line-height: 1.2; }
  .celda.hoy .num { color: var(--indigo); }
  .celda .chip-t { font-size: 9.5px; padding: 1px 5px; border-radius: 5px; }
  .it { font-size: 11.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 4px; align-items: center; min-width: 0; }
  .it > span { overflow: hidden; text-overflow: ellipsis; }
  .it b { font-weight: 700; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .cuad { width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid var(--tarea); flex: none; }
  .hecha { opacity: .5; text-decoration: line-through; }
  .tag { font-style: normal; font-size: 8.5px; font-weight: 800; padding: 0 4px; border-radius: 4px; flex: none; letter-spacing: .03em; }
  .tag.egs { background: var(--src-egs-bg); color: var(--src-egs); }
  .tag.ag { background: var(--src-ag-bg); color: var(--src-ag); }
  .tag.casa { background: color-mix(in srgb, var(--area-otro) 18%, transparent); color: var(--area-otro); }
  .mas { font-size: 10.5px; color: var(--muted); font-weight: 600; }

  /* ── Semana ── */
  .semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; height: 100%; }
  .scol { border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .scol.hoy { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); }
  .scol-cab { padding: 8px 8px 6px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .scol-cab .num { font-size: 15px; font-weight: 800; }
  .scol-cab .chip-t { white-space: normal; font-size: 10.5px; }
  .scol-cab .num small { font-family: 'Inter', sans-serif; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; margin-right: 4px; }
  .scol.hoy .scol-cab .num { color: var(--indigo); }
  .scol-lista { overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
  .ficha { border-radius: 8px; padding: 5px 7px; font-size: 12.5px; line-height: 1.3; word-break: break-word; cursor: pointer; }
  .ficha b { display: block; font-size: 11px; opacity: .85; }
  .ficha.fh { background: var(--src-fh-bg); border-left: 3px solid var(--tarea); }
  .ficha.egs { background: var(--src-egs-bg); border-left: 3px solid var(--src-egs); }
  .ficha.casa { background: color-mix(in srgb, var(--area-otro) 14%, transparent); border-left: 3px solid var(--area-otro); }

  /* ── Día ── */
  /* ── Fin de semana y Compras ── */
  .finde { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; height: 100%; }
  .finde .scol-cab .num { font-size: 18px; }
  .finde .scol-cab .num small { font-size: 13px; }
  .finde .scol-lista { gap: 7px; padding: 8px; }
  .finde .ficha { font-size: 14.5px; padding: 9px 11px; }
  .finde .ficha b { display: inline; font-size: 13px; margin-right: 6px; }
  .finde-planes { font-size: 12.5px; font-weight: 800; color: var(--muted); margin-top: 8px; }
  .finde .hoy-fila .btn { height: 34px; min-width: 34px; padding: 0 8px; }
  .compras { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .compra { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; font-size: 13.5px; }
  .compra.hecha { opacity: .55; }
  .compra.hecha .compra-t { text-decoration: line-through; }
  .compra-ok { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; cursor: pointer; }
  .compra-t { flex: 1; min-width: 0; line-height: 1.3; word-break: break-word; }
  .compra-t small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; }
  .compra b { white-space: nowrap; }
  .fila-borra { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--atr-fecha); font-size: 14px; cursor: pointer; }
  .hoy-card .compra { margin: 0 0 6px; }
  .hoy-card .compra .quien { margin-right: 5px; vertical-align: 1px; }
  .gastos-mes { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  @media (max-width: 700px) { .finde { grid-template-columns: minmax(0, 1fr); height: auto; } }

  /* ── Viajes (cuaderno) y Vuelos ── */
  .vj-tira { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .vj-sel { flex: none; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left; }
  .vj-sel.on { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); background: var(--indigo-soft); }
  .vj-sel .e { font-size: 22px; }
  .vj-sel b { display: block; font-size: 14px; }
  .vj-sel small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .vj-portada { border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: linear-gradient(135deg, var(--indigo-soft), transparent 70%), var(--card); border: 1px solid var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .vj-portada .e { font-size: 42px; line-height: 1; }
  .vj-portada h3 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .vj-portada .sub { color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .vj-portada .notas { font-size: 13px; color: var(--muted); margin-top: 4px; max-width: 70ch; }
  .vj-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto; }
  .vj-pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--seg-bg); white-space: nowrap; }
  .vj-pill.aviso { background: var(--aviso-bg); color: var(--aviso-fg); }
  .vj-pill.ok { background: var(--ev-fitness-bg); color: var(--ev-fitness-fg); }
  .vj-dias { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; align-items: start; }
  .vj-dia { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .vj-dia.hoy { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); }
  .vj-dia-cab { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--col-bg); }
  .vj-dia-cab .n { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card); font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; font-size: 16px; flex: none; }
  .vj-dia.hoy .vj-dia-cab .n { background: var(--indigo); color: #fff; }
  .vj-dia-cab b { font-size: 14px; display: block; }
  .vj-dia-cab small { color: var(--muted); font-size: 12px; }
  .vj-lista { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .vj-it { display: flex; gap: 8px; align-items: flex-start; border-radius: 9px; padding: 7px 9px; font-size: 13px; line-height: 1.3; background: var(--col-bg); border-left: 3px solid var(--soft); }
  .vj-it.Ver { border-left-color: var(--ev-personal-dot); }
  .vj-it.Comer { border-left-color: var(--area-cocina); }
  .vj-it.Moverse { border-left-color: var(--ev-trip-dot); }
  .vj-it.Dormir { border-left-color: var(--ev-fitness-dot); }
  .vj-it .h { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 38px; color: var(--muted); }
  .vj-it .t { flex: 1; min-width: 0; word-break: break-word; }
  .vj-it .t b { font-weight: 700; }
  .vj-it .t small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .vj-it a.mapa { font-size: 11.5px; color: var(--indigo); font-weight: 600; text-decoration: none; }
  .vj-sin { font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px; background: var(--aviso-bg); color: var(--aviso-fg); margin-left: 4px; white-space: nowrap; }
  .vj-duermes { font-size: 12px; font-weight: 600; color: var(--ev-fitness-fg); background: var(--ev-fitness-bg); border-radius: 8px; padding: 6px 9px; }
  .vj-pend { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; }
  .vj-pend:first-of-type { border-top: 0; }
  .vj-pend .c { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--soft); display: grid; place-items: center; flex: none; font-size: 12px; }
  .vj-pend.hecho { color: var(--soft); text-decoration: line-through; }
  .vj-pend.hecho .c { background: var(--ev-fitness-dot); border-color: var(--ev-fitness-dot); color: #fff; }
  .vj-arriba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 10px; }
  .vj-caja { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .vj-caja h4 { font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
  .vu-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; align-items: start; }
  .vu { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--ev-trip-dot) 12%, transparent), transparent 60%); }
  .vu.prox { border-color: var(--ev-trip-dot); }
  .vu-cab { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: var(--muted); }
  .vu-cab .cuenta { background: var(--ev-trip-bg); color: var(--ev-trip-fg); padding: 3px 9px; border-radius: 999px; }
  .vu-ruta { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; }
  .vu-ruta .ap { font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; }
  .vu-ruta .ap small { display: block; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .vu-ruta .linea { flex: 1; border-top: 2px dashed var(--ev-trip-dot); opacity: .7; }
  .vu-ruta .ap:last-child { text-align: right; }
  .vu-datos { display: flex; flex-wrap: wrap; gap: 5px; font-size: 12px; }
  .vu-datos span { background: var(--seg-bg); border-radius: 7px; padding: 3px 8px; font-weight: 600; }
  .vu-salida { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; border-radius: 10px; padding: 10px 12px; background: var(--col-bg); }

  /* ── Incrustada en calendario.html (?solo=resumen): sin cabecera ni lateral ── */

  /* ── Resumen: todo lo del día de un vistazo ── */
  #contenido > .hoy { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }

  .horario-dia.pasado { opacity: .5; }
  .horario-dia b { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
  .horario-dia .h { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 800; margin-bottom: 5px; }
  .horario-dia span.q { display: block; word-break: break-word; }
  @media (max-width: 700px) { .horario-dias { grid-template-columns: minmax(0, 1fr); } }
  .hoja label.enc { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  .hoja .enc-campo { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 14px; background: var(--card); color: var(--ink); }
  @media (max-width: 1100px) { #contenido > .hoy { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) { #contenido > .hoy { grid-template-columns: minmax(0, 1fr); } }
  .dia { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .dia-cab { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dia h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 4px 0 8px; }

    display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line);

  }

  /* ── Kanban ── */
  .kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; height: 100%; }
  .kcol { background: var(--col-bg); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  .tarjeta {
    background: var(--card); border-radius: 10px; padding: 8px 10px; border-left: 4px solid var(--c); box-shadow: var(--shadow);
    cursor: pointer;
  }
  .tarjeta.fh { --c: var(--src-fh); } .tarjeta.egs { --c: var(--src-egs); } .tarjeta.ag { --c: var(--src-ag); }
  .tarjeta .t { font-weight: 600; font-size: 13.5px; line-height: 1.3; word-break: break-word; }
  .tarjeta .m { font-size: 11.5px; color: var(--muted); margin-top: 4px; display: flex; gap: 4px 8px; flex-wrap: wrap; align-items: center; }
  .fuente { font-weight: 700; color: var(--c); }
  .venc { color: var(--atr-fecha); font-weight: 700; }
  .prio { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .masbtn { border: 1px dashed var(--soft); background: transparent; color: var(--muted); border-radius: 10px; padding: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; }

  /* ── Lateral: resumen + parte ── */
  .stats { display: grid; gap: 8px; }
  .stat {
    display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 10px;
    padding: 8px 12px; border-left: 4px solid var(--c); cursor: pointer; border-radius: 12px;
  }
  .stat .l { font-size: 14px; font-weight: 700; }
  .stat .n { font-size: 30px; font-weight: 800; line-height: 1; text-align: center; color: var(--c); font-variant-numeric: tabular-nums; }
  .stat .d { font-size: 12px; color: var(--muted); line-height: 1.3; }
  .stat .d .venc { font-weight: 700; }
  .parte { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 14px; }
  .parte-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .parte-cab h3 { font-size: 15px; font-weight: 800; }
  .parte-nav { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .parte-nav button { border: none; background: var(--seg-bg); border-radius: 8px; width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
  .parte-nav button:disabled { opacity: .35; }
  .md { overflow: auto; flex: 1; min-height: 0; font-size: 14px; line-height: 1.5; }
  .md p { margin-bottom: 8px; }
  .md ul { margin: 0 0 8px 18px; }
  .md li { margin-bottom: 4px; }
  .md h4 { font-size: 14px; margin: 8px 0 4px; }
  .md code { font-size: 12.5px; background: var(--seg-bg); padding: 0 4px; border-radius: 4px; }
  .pie { font-size: 11.5px; color: var(--muted); padding: 0 4px; }
  .pie .aviso { color: var(--aviso-fg); background: var(--aviso-bg); border: 1px solid var(--aviso-line); border-radius: 8px; padding: 6px 8px; display: block; margin-top: 4px; }

  /* ── Casa: gastos con Montse, tareas compartidas y reparto de la casa ── */
  #contenido > .casa { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; min-height: 100%; }
  .casa-cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .casa-cab .chips { margin-left: 0; }
  .casa-cab .sep { flex: 1; }
  .casa-cab .btn { height: 34px; font-size: 13.5px; }
  .casa-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .casa-stat { padding: 8px 12px; border-left: 4px solid var(--c); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 58px; cursor: pointer; }
  .casa-stat .n { font-size: 21px; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .casa-stat .l { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.3; }
  .casa-cuerpo { display: grid; gap: 12px; min-height: 0; }
  .casa-abajo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .casa-panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: 8px; }
  .casa-panel h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .casa-panel h4 .n { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .casa-panel h4 a { color: var(--indigo); text-decoration: none; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .rutinas { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; height: min(400px, 50vh); }
  .rutinas.tablero { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .rcol { background: var(--col-bg); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .rcol.hoy { box-shadow: inset 0 0 0 2px var(--indigo); }
  .rcol-cab { padding: 6px 7px 4px; font-size: 12.5px; font-weight: 800; display: flex; align-items: baseline; gap: 4px; }
  .rcol-cab small { font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: 10.5px; }
  .rcol-cab .n { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; }
  .rlista { overflow: auto; padding: 0 5px 6px; display: flex; flex-direction: column; gap: 5px; }
  .rut { background: var(--card); border-radius: 8px; padding: 6px 8px; border-left: 4px solid var(--c); box-shadow: var(--shadow); cursor: pointer; font-size: 12.5px; line-height: 1.3; }
  .rut .t { font-weight: 600; word-break: break-word; }
  .rut .m { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .rut .m b { color: var(--atr-fecha); }
  .rut.hecha { opacity: .55; } .rut.hecha .t { text-decoration: line-through; }
  .pers { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; font-size: 9.5px; font-weight: 800; background: var(--indigo-soft); color: var(--indigo); flex: none; }
  .pers.m { background: color-mix(in srgb, var(--montse) 18%, transparent); color: var(--montse); }
  .pers.a { background: var(--seg-bg); color: var(--ink); }
  .gasto { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; margin-bottom: 5px; cursor: pointer; }
  .gasto .sub { font-size: 11px; color: var(--muted); display: block; }
  .gasto .imp { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .barras { display: grid; gap: 4px; font-size: 11.5px; margin-bottom: 8px; }
  .barra { display: grid; grid-template-columns: 76px minmax(0, 1fr) 64px; gap: 6px; align-items: center; }
  .barra i { display: block; height: 8px; border-radius: 4px; background: var(--src-fh); }
  .barra b { text-align: right; font-variant-numeric: tabular-nums; }
  .lista-scroll { overflow: auto; max-height: 280px; }
  .lfila.hecha { opacity: .5; }
  /* Formularios de las hojas */
  .form { display: grid; gap: 10px; margin-bottom: 14px; }
  .form label { font-size: 12px; font-weight: 700; color: var(--muted); display: grid; gap: 4px; }
  .form input, .form select { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-family: inherit; }
  .form .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opc { display: flex; gap: 6px; flex-wrap: wrap; }
  .opc button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .opc button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.peligro { color: var(--atr-fecha); }

  /* ── Hoja de detalle ── */
  .hoja { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .hoja.on { display: flex; }
  .hoja-in {
    background: var(--card); width: min(560px, 100%); border-radius: 18px 18px 0 0; padding: 18px 20px 22px;
    box-shadow: var(--sheet-shadow); max-height: 80vh; overflow: auto;
  }
  .hoja-in h3 { font-size: 18px; line-height: 1.3; margin: 6px 0 8px; }
  .hoja-in .det { font-size: 13.5px; color: var(--muted); display: grid; gap: 4px; margin-bottom: 14px; }
  .hoja-in .acc { display: flex; gap: 8px; flex-wrap: wrap; }
  .hoja-in .acc .btn { height: 46px; flex: 1; min-width: 120px; }
  .btn.prim { background: var(--indigo); border-color: var(--indigo); color: #fff; }

  /* ── Acceso ── */
  /* Portada: siempre oscura, sea cual sea el tema del panel, para que la imagen se lea igual. */
  #login { position: fixed; inset: 0; display: none; z-index: 30; overflow: auto; color: #F8FAFC;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    background: linear-gradient(90deg, #0b132640, #0b1326a6), url('/cab-hogar.jpg') center / cover no-repeat, #0b1326; }
  #login .portada { margin: auto; width: min(1120px, 100%); min-height: min(640px, 100%); display: grid; grid-template-columns: 1fr minmax(320px, 380px); gap: 56px; align-items: center; }
  #login .lema { align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
  #login .hora { font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; font-size: clamp(64px, 11vw, 124px); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  #login .fecha { margin-top: 12px; font-size: clamp(17px, 2vw, 22px); color: #cbd5e1; }
  #login .fecha::first-letter { text-transform: uppercase; }
  #login h1 { font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.01em; }
  #login .sub { margin-top: 6px; font-size: 15px; color: #cbd5e1; }
  #login .caja { width: 100%; padding: 26px; background: #131b2ed9; border: 1px solid #ffffff1f; border-radius: 18px; box-shadow: 0 18px 50px #00000059; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #login h2 { font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 6px; }
  #login .caja p { font-size: 14px; line-height: 1.45; color: #cbd5e1; margin-bottom: 18px; }
  #login input { width: 100%; border: 1px solid #334155; background: #0b1326b3; color: #F8FAFC; border-radius: 10px; padding: 12px; font-size: 16px; margin-bottom: 8px; font-family: inherit; }
  #login input::placeholder { color: #94A3B8; }
  #login .btn { width: 100%; height: 48px; margin-bottom: 8px; background: transparent; border-color: #475569; color: #F8FAFC; font-size: 15px; }
  #login .btn.prim { background: #ffb783; border-color: #ffb783; color: #2a1506; margin-bottom: 14px; }
  #login .btn:last-child { margin-bottom: 0; }
  #login input:focus-visible, #login .btn:focus-visible { outline: 2px solid #ffb783; outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { #login .portada { animation: portada-entra .5s ease-out both; } }
  @keyframes portada-entra { from { opacity: 0; transform: translateY(8px); } }
  @media (max-width: 860px), (orientation: portrait) {
    #login { background-position: center, 50% 30%, center; background-image: linear-gradient(#0b132680, #0b1326cc), url('/cab-hogar.jpg'); }
    #login .portada { grid-template-columns: minmax(0, 480px); justify-content: center; gap: 28px; min-height: 0; }
    #login .lema { gap: 16px; }
  }
  @media (max-height: 520px) and (min-width: 861px) { #login .hora { font-size: 64px; } #login .sub { display: none; } #login .portada { gap: 32px; } }

  /* Vertical o pantallas pequeñas: el lateral pasa debajo y se desplaza todo. */
  @media (max-width: 980px), (orientation: portrait) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100dvh; }
    .cuerpo { grid-template-columns: 1fr; }
    .vista { height: 72vh; }
    .parte { max-height: 70vh; }
  }
  @media (max-width: 700px) {
    .kanban { grid-template-columns: repeat(4, minmax(220px, 1fr)); }
    .semana { grid-template-columns: repeat(7, minmax(130px, 1fr)); }
    .dia { grid-template-columns: 1fr; }
    .casa-abajo { grid-template-columns: 1fr; }
    .casa-stats { grid-template-columns: 1fr; }
    .rutinas { grid-template-columns: repeat(7, minmax(120px, 1fr)); overflow-x: auto; }
    .reloj b { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="reloj"><b id="hora">--:--</b><span id="fecha"></span></div>
    <div class="turnos-hoy" id="turnoHoy"></div>
    <div class="der">
      <nav class="seg" id="segVista">
        <button data-v="hoy">Resumen</button><button data-v="mes">Mes</button><button data-v="semana">Semana</button><button data-v="dia">Día</button><button data-v="kanban">Kanban</button><button data-v="casa">Casa</button><button data-v="gastos">Gastos</button><button data-v="compras">Compras</button><button data-v="finde">Fin de semana</button><button data-v="viajes">Viajes</button><button data-v="vuelos">Vuelos</button>
      </nav>
      <div class="nav" id="navFechas">
        <button class="btn" id="atras" aria-label="Anterior">‹</button>
        <button class="btn" id="hoyBtn">Hoy</button>
        <button class="btn" id="adelante" aria-label="Siguiente">›</button>
      </div>
      <button class="btn" id="temaBtn" title="Tema"></button>
      <button class="btn" id="recargarBtn" title="Recargar la página (trae la última versión)">⟳</button>
      <button class="btn" id="pantallaBtn" title="Pantalla completa">⛶</button>
    </div>
  </header>
  <main class="cuerpo">
    <section class="vista">
      <div class="vista-cab">
        <h2 id="titulo"></h2>
        <div class="chips" id="filtroFuente">
          <button data-f="todo">Todo</button><button data-f="fh">FileHub</button><button data-f="egs">EGStrategy</button><button data-f="ag">Agentes</button>
        </div>
        <div class="chips" id="filtroCal" title="Qué calendario ves: todo, solo lo tuyo, lo común o el de Montse">
          <button data-c="todo">Todo</button><button data-c="mio">Mío</button><button data-c="comun">👥 Común</button><button data-c="montse">Montse</button>
        </div>
      </div>
      <div id="contenido"></div>
    </section>
    <aside class="lateral">
      <div class="stats" id="stats"></div>
      <div class="parte card">

          <h3>☀️ Parte del agente</h3>

        </div>
        <div id="parteTexto" class="md"></div>
      </div>
      <div class="pie" id="estado"></div>
    </aside>
  </main>

    await new Promise(ok => setTimeout(ok, 700 * (i + 1)));

// Elementos de un día en el calendario: eventos (por hora), tareas de casa (de los dos, con su hora),
// tareas de FileHub y tareas de EGStrategy que vencen.
function itemsDia(f) {
  const ev = eventos.filter(e => (e.start_date || '').slice(0, 10) === f && pasaCal(e))
    .map(e => ({ k: 'ev', hora: horaDe(e), titulo: e.title, est: estiloEv(e), raw: e }));
  const cs = casa.filter(t => t.kind === 'tarea' && t.fecha === f && pasaCasaCal(t))
    .map(t => ({ k: 'casa', hora: (t.hora || '').slice(0, 5), titulo: t.title, raw: t }));
  const conHora = [...ev, ...cs].sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99'));
  const fh = tareasMes.filter(t => dueDe(t) === f && pasaCal(t)).map(t => ({ k: 'fh', titulo: t.title, raw: t }));
  const eg = (verEgsCal() ? egsTareas() : []).filter(t => t.vence === f).map(t => ({ k: 'egs', titulo: t.texto, raw: t }));
  return [...conHora, ...fh, ...eg];
}
function itemMini(it) {

  if (it.k === 'fh') return `<div class="it${it.raw.completed ? ' hecha' : ''}"><i class="cuad"></i><span>${esc(it.titulo)}</span></div>`;
  if (it.k === 'casa') return `<div class="it${it.raw.done ? ' hecha' : ''}"><i class="tag casa">CASA</i><span>${it.hora ? `<b>${it.hora}</b> ` : ''}${esc(it.titulo)}</span></div>`;
  return `<div class="it"><i class="tag egs">EGS</i><span>${esc(it.titulo)}</span></div>`;
}
function ficha(it) {

  return `<div class="ficha egs" data-egs="${esc(it.raw.id)}"><i class="tag egs">EGS</i> ${esc(it.titulo)}</div>`;
}

      const d = masDias(inicio, f * 7 + c), s = ymd(d), its = itemsDia(s);

}

// ── Casa: gastos con Montse, tareas compartidas y reparto de la casa ──────

const minTxt = n => { const h = Math.floor(n / 60), m = n % 60; return h && m ? `${h} h ${m} min` : h ? `${h} h` : `${m} min`; };

async function abreBillete(id, j, modo) {

  const { data, error } = await sb.storage.from('files').createSignedUrl(b.path, 600, modo === 'bajar' ? { download: b.nombre } : undefined);
  if (error || !data?.signedUrl) { w?.close(); alert('No se pudo abrir el billete: ' + (error?.message || 'sin enlace')); return; }
  if (modo === 'ver') { if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl; return; }
  const a = document.createElement('a'); a.href = data.signedUrl; a.download = b.nombre; document.body.appendChild(a); a.click(); a.remove();
}

function tituloVista() {
  if (vista === 'viajes') return 'Viajes';
  if (vista === 'vuelos') return 'Vuelos';
  if (vista === 'hoy') return 'Resumen de hoy';
  if (vista === 'mes') return cap(fmt(cursor, { month: 'long', year: 'numeric' }));
  if (vista === 'semana' || (vista === 'casa' && casaModo === 'semana')) {
    const l = masDias(cursor, -((cursor.getDay() + 6) % 7)), d = masDias(l, 6);
    return (vista === 'casa' ? 'Casa · ' : '') + `${fmt(l, { day: 'numeric', month: 'short' })} – ${fmt(d, { day: 'numeric', month: 'short', year: 'numeric' })}`.replace(/\./g, '');
  }
  if (vista === 'dia') return cap(fmt(cursor, { weekday: 'long', day: 'numeric', month: 'long' }));
  if (vista === 'gastos') return 'Gastos · ' + cap(fmt(cursor, { month: 'long', year: 'numeric' }));
  if (vista === 'finde') {
    const s = sabadoDe(cursor), dom = masDias(s, 1), mesCorto = d => fmt(d, { month: 'short' }).replace('.', '');
    return `Fin de semana · ${s.getDate()}${s.getMonth() === dom.getMonth() ? '' : ' ' + mesCorto(s)}–${dom.getDate()} ${mesCorto(dom)}`;

  if (vista === 'compras') return 'Compras';

}

// Markdown sencillo del parte (negritas, cursivas, listas y títulos).
function md(txt) {
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(«])[*_](?!\s)(.+?)[*_](?=[\s).,:;!?»—-]|$)/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  let h = '', lista = false;
  for (const linea of String(txt).split(/\r?\n/)) {
    const l = linea.trim(), li = l.match(/^[-*•]\s+(.*)/);
    if (li) { if (!lista) { h += '<ul>'; lista = true; } h += `<li>${inline(li[1])}</li>`; continue; }
    if (lista) { h += '</ul>'; lista = false; }
    if (!l) continue;
    const tit = l.match(/^#{1,4}\s+(.*)/);
    h += tit ? `<h4>${inline(tit[1])}</h4>` : `<p>${inline(l)}</p>`;
  }
  return h + (lista ? '</ul>' : '');
}

function hace(ms) {

async function accionFH(id, acc) {

    const t = [...pendientes, ...hechasFH, ...tareasMes].find(x => String(x.id) === String(id));
    if (!t || !confirm(`¿Borrar «${t.title}»?`)) return;
    if (!DEMO) {
      const { error } = await conReintento(() => sb.from('tasks').delete().eq('id', id));
      if (error) return avisaFallo(error, 'borrar');
    }
    const queda = x => String(x.id) !== String(id);
    pendientes = pendientes.filter(queda); hechasFH = hechasFH.filter(queda); tareasMes = tareasMes.filter(queda);
    cierraHoja(); render(); return;
  }
  const cambios = acc === 'hecha' ? { completed: true, stage: null } : acc === 'curso' ? { completed: false, stage: 'en-curso' } : { completed: false, stage: null };
  if (DEMO) {
    for (const t of [...pendientes, ...hechasFH, ...tareasMes]) if (String(t.id) === String(id)) Object.assign(t, cambios);
    pendientes = [...pendientes, ...hechasFH].filter((t, i, a) => !t.completed && a.findIndex(x => x.id === t.id) === i);
    hechasFH = [...hechasFH, ...tareasMes].filter((t, i, a) => t.completed && a.findIndex(x => x.id === t.id) === i);
    cierraHoja(); render(); return;
  }
  const { error } = await conReintento(() => sb.from('tasks').update(cambios).eq('id', id));
  if (error) { alert('No se pudo guardar: ' + (esRedFallo(error.message) ? 'sin conexión, inténtalo otra vez' : error.message)); return; }
  cierraHoja();
  await cargar();
}

const avisaFallo = (error, que) => alert(`No se pudo ${que}: ` + (esRedFallo(error?.message) ? 'sin conexión, inténtalo otra vez' : error?.message || 'error'));
async function escribe(tabla, fn, que) {
  if (DEMO) return true;
  const { error } = await conReintento(() => fn(sb.from(tabla)));
  if (error) { avisaFallo(error, que); return false; }
  return true;
}
async function accionCasa(id, acc) {
  const r = casa.find(x => x.id === id);
  if (!r) return;
  const esRut = r.kind === 'limpieza';
  if (acc === 'editar') return formRutina(r);
  if (acc === 'borrar') {
    if (!confirm(`¿Borrar «${r.title}»?`)) return;
    if (!(await escribe('casa_items', q => q.delete().eq('id', id), 'borrar'))) return;
    casa = casa.filter(x => x.id !== id);
  } else {
    let cambio;
    if (acc === 'hecha') {
      cambio = esRut ? { ultima_vez: HOY_S } : { done: true };
      // Turno alterno: al hacerla, la próxima le toca a la otra persona (como en la app Casa).
      if (esRut && r.categoria === 'alterna' && r.assignee !== 'ambos') cambio.assignee = r.assignee === 'carlos' ? 'montse' : 'carlos';
    } else if (acc === 'pendiente') cambio = esRut ? { ultima_vez: null } : { done: false };
    else if (acc.startsWith('asigna:')) cambio = { assignee: acc.slice(7) };
    else return;
    if (!(await escribe('casa_items', q => q.update({ ...cambio, updated_at: new Date().toISOString() }).eq('id', id), 'guardar'))) return;
    Object.assign(r, cambio);
  }
  cierraHoja(); render();
}
async function guardaRutina(id) {
  const title = campo('title'), cada = Math.min(365, Math.max(1, Math.round(Number(campo('cada_dias'))) || 7));
  const proxima = /^\d{4}-\d{2}-\d{2}$/.test(campo('proxima') || '') ? campo('proxima') : HOY_S;
  if (!title) { alert('Escribe qué hay que hacer.'); return; }
  const r = id ? casa.find(x => x.id === id) : null;
  // La app Casa calcula «toca» como última + cada: para que toque el día elegido, última = ese día − cada.
  const fila = { title, assignee: elegido('assignee') || 'ambos', categoria: elegido('categoria') || 'fijo', cada_dias: cada,
    ultima_vez: ymd(masDias(deYmd(proxima), -cada)), datos: { ...(r?.datos || {}), area: elegido('area') || 'limpieza' } };
  if (r) {
    if (!(await escribe('casa_items', q => q.update({ ...fila, updated_at: new Date().toISOString() }).eq('id', id), 'guardar'))) return;
    Object.assign(r, fila);
  } else {
    const nueva = { kind: 'limpieza', ...fila, created_by: emailSesion || null };
    if (DEMO) { casa.push({ id: 'c' + Date.now(), ...nueva, created_at: new Date().toISOString() }); }
    else {
      const { data, error } = await conReintento(() => sb.from('casa_items').insert(nueva).select(COLS_CASA).single());
      if (error) { avisaFallo(error, 'guardar'); return; }
      casa.push(data);
    }
  }
  cierraHoja(); render();
}

$('hoja').addEventListener('click', e => {
  if (e.target === $('hoja') || e.target.closest('[data-cerrar]')) { cierraHoja(); return; }
  const o = e.target.closest('.opc button');
  if (o) { o.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === o)); return; }
  const b = e.target.closest('[data-acc]');
  if (b) return accionFH(b.dataset.id, b.dataset.acc);
  const c = e.target.closest('[data-cacc]');
  if (c) return accionCasa(c.dataset.id, c.dataset.cacc);
  const g = e.target.closest('[data-gacc]');
  if (g) return borraGasto(g.dataset.id);

function cambiaVista(v) {
  // El fin de semana y los gastos se abren siempre en el actual, aunque vinieras de otro mes.
  const alActual = v !== vista && (v === 'finde' || v === 'gastos');
  vista = v; localStorage.setItem('fh_tab_vista', v);
  if (alActual) cursor = new Date(HOY);
  // El resumen es siempre de hoy: si estabas en otro mes, hay que volver a pedir sus datos.
  if ((v === 'hoy' || alActual) && !DEMO && rangoMes(HOY).desde !== mesCargado) { cursor = new Date(HOY); cargar(); return; }
  render();
}

  const fb = t.closest('[data-fhborra]');

  const cb = t.closest('[data-cborra]');
  if (cb) return accionCasa(cb.dataset.cborra, 'borrar');

  const cp = t.closest('[data-comprado]');

  const ap = t.closest('[data-apuntar]');

  const iv = t.closest('[data-irvista]');
  // Incrustada no hay pestañas para volver: el kanban se abre en la tablet completa.
  if (iv) { if (SOLO_RESUMEN) window.open('/tablet.html', '_blank', 'noopener'); else cambiaVista(iv.dataset.irvista); return; }
  if (t.closest('#verSinFecha')) { verSinFecha = !verSinFecha; render(); return; }
  if (t.closest('#nuevaRutina')) return formRutina();
  if (t.closest('#nuevoGasto')) return formGasto();
  const pe = t.closest('[data-pers]'), cm = t.closest('[data-cmodo]');
  if (pe) { persona = pe.dataset.pers; localStorage.setItem('fh_tab_persona', persona); render(); return; }
  if (cm) { casaModo = cm.dataset.cmodo; localStorage.setItem('fh_tab_casa', casaModo); render(); return; }
  if (t.closest('[data-gastos]')) return formGasto();
  const fh = t.closest('[data-fh]'), eg = t.closest('[data-egs]'), ag = t.closest('[data-ag]'), cs = t.closest('[data-casa]'), ga = t.closest('[data-gasto]');
  if (fh) return hojaFH(fh.dataset.fh);
  if (eg) return hojaEGS(eg.dataset.egs);
  if (ag) return hojaAG(ag.dataset.ag);
  if (cs) return hojaCasa(cs.dataset.casa);
  if (ga) return hojaGasto(ga.dataset.gasto);
  const dia = t.closest('[data-dia]');
  if (dia) { cursor = deYmd(dia.dataset.dia); cambiaVista('dia'); }
});
// Solo se vuelve a pedir a Supabase si el cursor sale del mes cargado.
const irA = async d => { cursor = d; if (!DEMO && rangoMes(cursor).desde !== mesCargado) await cargar(); else render(); };
const mueve = dir => irA(vista === 'mes' || vista === 'gastos' ? new Date(cursor.getFullYear(), cursor.getMonth() + dir, 1)
  : masDias(cursor, dir * (vista === 'semana' || vista === 'casa' || vista === 'finde' ? 7 : 1)));
$('atras').onclick = () => mueve(-1);
$('adelante').onclick = () => mueve(1);

// ⟳ recarga la página entera con la última versión: pide de nuevo el HTML saltándose
// la caché del navegador, activa el service worker nuevo si lo hay y recarga.
$('recargarBtn').onclick = async () => {
  const b = $('recargarBtn');
  b.disabled = true; b.textContent = '…';
  try {
    const reg = await navigator.serviceWorker?.getRegistration?.();
    await reg?.update?.().catch(() => {});
    reg?.waiting?.postMessage({ type: 'SKIP_WAITING' });
    await fetch(location.href, { cache: 'reload' }).catch(() => {});
  } catch {}
  location.reload();
};
$('pantallaBtn').onclick = () => {

// Tema: el mismo interruptor que el calendario (auto → claro → oscuro).
const TEMAS = ['auto', 'light', 'dark'], TEMA_ICONO = { auto: '🌗', light: '☀️', dark: '🌙' };
const mqOscuro = matchMedia('(prefers-color-scheme: dark)');
function aplicaTema() {
  const pref = localStorage.getItem('fh_cal_tema') || 'auto';
  const oscuro = pref === 'dark' || (pref === 'auto' && mqOscuro.matches);
  document.documentElement.dataset.tema = oscuro ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]').content = oscuro ? '#0b1326' : '#f4f6fa';
  $('temaBtn').textContent = TEMA_ICONO[pref];
}
$('temaBtn').onclick = () => {
  const pref = localStorage.getItem('fh_cal_tema') || 'auto';
  localStorage.setItem('fh_cal_tema', TEMAS[(TEMAS.indexOf(pref) + 1) % TEMAS.length]);
  aplicaTema();
};
mqOscuro.addEventListener?.('change', aplicaTema);
// Si se cambia el tema en el calendario que la incrusta, se aplica aquí también.
addEventListener('storage', e => { if (e.key === 'fh_cal_tema') aplicaTema(); });
aplicaTema();

// ── Pantalla fija: reloj, pantalla siempre encendida y recarga sola ────────
function reloj() {
  const n = new Date();
  if (ymd(n) !== HOY_S) { location.reload(); return; } // cambio de día: todo se recalcula
  $('hora').textContent = n.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  $('fecha').textContent = cap(fmt(n, { weekday: 'long', day: 'numeric', month: 'long' }));
}
reloj();
setInterval(reloj, 10000);
let bloqueo = null;
async function despierta() {
  if (SOLO_RESUMEN) return; // mantener la pantalla encendida es cosa de la tablet, no del calendario
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !bloqueo) { bloqueo = await navigator.wakeLock.request('screen'); bloqueo.addEventListener('release', () => { bloqueo = null; }); } } catch { /* sin permiso: la tablet se apagará según sus ajustes */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  despierta();
  if (Date.now() - ultimaCarga > 60000) cargar();
});
document.addEventListener('pointerdown', despierta, { once: true });
setInterval(() => { if (document.visibilityState === 'visible') cargar(); }, 5 * 60000);

// ── Se actualiza sola: cada despliegue cambia CACHE_VERSION en sw.js. Si cambia
// mientras el panel está abierto, se recarga con la versión nueva (salvo que haya
// una ficha abierta o estés escribiendo; entonces lo intenta en la siguiente vuelta).
let versionVista = null;
async function miraVersion() {
  if (DEMO || document.visibilityState !== 'visible') return;
  try {
    const txt = await (await fetch('/sw.js?v=' + Date.now(), { cache: 'no-store' })).text();
    const v = (txt.match(/CACHE_VERSION\s*=\s*'([^']+)'/) || [])[1];
    if (!v) return;
    if (versionVista === null) { versionVista = v; return; }
    if (v === versionVista) return;
    const ocupado = $('hoja')?.classList.contains('on') || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if (ocupado) return;
    await fetch(location.href, { cache: 'reload' }).catch(() => {});
    location.reload();
  } catch { /* sin conexión: se mira en la siguiente vuelta */ }
}
miraVersion();
setInterval(miraVersion, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') miraVersion(); });

// Hora y fecha de la portada: solo se actualizan mientras está a la vista.
function relojPortada() {
  if ($('login').style.display !== 'flex') return;

}

function aplicaSesion(session) {
  const nuevo = session?.user?.id || null;
  if (nuevo === uid && ultimaCarga) return;
  uid = nuevo;
  emailSesion = (session?.user?.email || '').toLowerCase();
  $('login').style.display = uid || DEMO ? 'none' : 'flex';
  relojPortada();
  if (uid || DEMO) cargar(); else render();
}
sb.auth.onAuthStateChange((_ev, session) => {
  aplicaSesion(session);
  if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname + location.search);
});
(async () => {
  despierta();
  if (DEMO) { aplicaSesion(null); return; }
  const { data: { session } } = await sb.auth.getSession();
  aplicaSesion(session);
})();
