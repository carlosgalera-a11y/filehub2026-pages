<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>Panel · FileHub</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-calendario-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-calendario-180.png">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest-tablet.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Mismo tema que calendario.html (fh_cal_tema, compartido en este dominio): se
  // aplica antes de pintar para no ver un fogonazo blanco al abrir en oscuro.
  (function () {
    var pref = localStorage.getItem('fh_cal_tema') || 'auto';
    var oscuro = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.tema = oscuro ? 'dark' : 'light';
    // ?solo=resumen | viajes | vuelos → una sola vista, sin cabecera ni lateral (incrustada en calendario.html).
    var solo = new URLSearchParams(location.search).get('solo');
    if (['resumen', 'viajes', 'vuelos', 'egs', 'cap', 'proyectos', 'contactos', 'anotaciones', 'enlaces'].includes(solo)) document.documentElement.classList.add('solo');
  })();
</script>
<style>
  /* Panel fijo para la tablet (horizontal, ~1280×800). Tokens = calendario.html. */
  :root {
    --ink: #0f172a; --muted: #64748b; --soft: #94a3b8;
    --line: #e5e9f2; --bg: #f4f6fa; --card: #ffffff;
    --indigo: #4f46e5; --indigo-soft: #eef2ff; --indigo-ring: #4f46e51a;
    --shadow: 0 1px 2px rgba(15,23,42,.05), 0 4px 14px rgba(15,23,42,.05);
    --radius: 14px;
    --seg-bg: #e9edf5; --seg-on: #ffffff;
    --overlay: #0f172a59; --sheet-shadow: 0 -8px 30px #00000033;
    --aviso-bg: #fffbeb; --aviso-line: #fde68a; --aviso-fg: #92400e;
    --atr-fecha: #dc2626;
    --tarea: #0ea5e9; --montse: #db2777;
    --t-urg-bg: #dc2626; --t-urg-fg: #ffffff;
    --t-agm-bg: #16a34a; --t-agm-fg: #ffffff;
    --t-agt-bg: #2563eb; --t-agt-fg: #ffffff;
    --t-egs-bg: #facc15; --t-egs-fg: #4a3403;
    --ev-personal-bg: #e0e7ff; --ev-personal-fg: #4338ca; --ev-personal-dot: #6366f1;
    --ev-work-bg: #fef3c7;     --ev-work-fg: #b45309;     --ev-work-dot: #f59e0b;
    --ev-fitness-bg: #d1fae5;  --ev-fitness-fg: #047857;  --ev-fitness-dot: #10b981;
    --ev-trip-bg: #cffafe;     --ev-trip-fg: #0e7490;     --ev-trip-dot: #06b6d4;
    --ev-guardia-bg: #fee2e2;  --ev-guardia-fg: #b91c1c;  --ev-guardia-dot: #ef4444;
    --prio-high: #ef4444; --prio-medium: #f59e0b; --prio-low: #94a3b8;
    /* Fuentes de las tareas */
    --src-fh: #4f46e5; --src-fh-bg: #eef2ff;
    --src-egs: #0d9488; --src-egs-bg: #ccfbf1;
    --src-ag: #7c3aed; --src-ag-bg: #ede9fe;
    --col-bg: #eef1f7;
    /* Áreas de la casa */
    --area-limpieza: #0ea5e9; --area-cocina: #f97316; --area-compra: #10b981; --area-otro: #8b5cf6;
    color-scheme: light;
  }
  html[data-tema="dark"] {
    --ink: #f8fafc; --muted: #94a3b8; --soft: #64748b;
    --line: #283449; --bg: #0b1326; --card: #131b2e;
    --indigo: #8083ff; --indigo-soft: #8083ff26; --indigo-ring: #8083ff2e;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.30);
    --seg-bg: #1b2438; --seg-on: #222a3d;
    --overlay: #020617b3; --sheet-shadow: 0 -8px 30px #00000066;
    --aviso-bg: #3a2c0c; --aviso-line: #6b5312; --aviso-fg: #fcd34d;
    --atr-fecha: #f87171;
    --tarea: #38bdf8; --montse: #f472b6;
    --ev-personal-bg: #232a4d; --ev-personal-fg: #c0c1ff; --ev-personal-dot: #8083ff;
    --ev-work-bg: #3a2c12;     --ev-work-fg: #fcd34d;     --ev-work-dot: #f59e0b;
    --ev-fitness-bg: #10322a;  --ev-fitness-fg: #6ee7b7;  --ev-fitness-dot: #4edea3;
    --ev-trip-bg: #113240;     --ev-trip-fg: #67e8f9;     --ev-trip-dot: #22d3ee;
    --ev-guardia-bg: #3a1c1f;  --ev-guardia-fg: #fca5a5;  --ev-guardia-dot: #f87171;
    --prio-high: #f87171; --prio-medium: #fbbf24; --prio-low: #64748b;
    --src-fh: #8083ff; --src-fh-bg: #8083ff26;
    --src-egs: #2dd4bf; --src-egs-bg: #2dd4bf1f;
    --src-ag: #a78bfa; --src-ag-bg: #a78bfa24;
    --col-bg: #0f1729;
    --area-limpieza: #38bdf8; --area-cocina: #fb923c; --area-compra: #4edea3; --area-otro: #a78bfa;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.4;
    overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
    overflow-wrap: break-word;
  }
  h1, h2, h3, h4, .reloj b, .num, .stat .n { font-family: 'Hanken Grotesk', 'Inter', sans-serif; }
  button { font-family: inherit; color: inherit; }
  .app {
    height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px;
    /* Columna del ancho de la pantalla: sin esto crece hasta el contenido más ancho (las pestañas, un enlace
       largo) y el navegador del móvil o la tablet encoge toda la página para que quepa. */
    grid-template-columns: minmax(0, 1fr);
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
  }

  /* ── Cabecera ── */
  .top { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
  .reloj { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .reloj b { font-size: 36px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .reloj span { color: var(--muted); font-weight: 600; font-size: 15px; white-space: nowrap; }
  .turnos-hoy { display: flex; gap: 6px; flex-wrap: wrap; }
  .top .der { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; max-width: 100%; }
  /* Pestañas en una sola fila: si no caben (móvil, o la tablet con muchas), se desliza de lado. */
  .seg { display: inline-flex; background: var(--seg-bg); border-radius: 12px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .seg::-webkit-scrollbar { display: none; }
  @media (max-width: 700px) { .top .der { margin-left: 0; width: 100%; } .seg { width: 100%; } .reloj b { font-size: 30px; } }
  .seg button {
    border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px;
    padding: 8px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; flex: none;
  }
  .seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
  .btn {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px; min-width: 40px; height: 40px;
    padding: 0 12px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:active, .seg button:active { transform: scale(.97); }
  .nav { display: inline-flex; gap: 6px; }

  /* ── Cuerpo: vista + lateral ── */
  .cuerpo { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; min-height: 0; }
  .vista, .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .vista { display: flex; flex-direction: column; min-height: 0; padding: 12px 12px 10px; }
  .vista-cab { display: flex; align-items: center; gap: 10px; margin: 0 2px 10px; flex-wrap: wrap; }
  .vista-cab h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .chips { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .chips button {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px;
    font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #contenido { flex: 1; min-height: 0; overflow: auto; }
  .lateral { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  .chip-t {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; letter-spacing: .01em;
  }
  .turnos-hoy .chip-t { font-size: 13px; padding: 5px 10px; border-radius: 8px; }
  .vacio { color: var(--soft); font-size: 13px; padding: 6px 2px; }
  .quien { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; font-size: 9px; font-weight: 800; background: var(--indigo-soft); color: var(--indigo); flex: none; }
  .quien.m { background: color-mix(in srgb, var(--montse) 18%, transparent); color: var(--montse); }

  /* ── Mes ── */
  .v-mes { overflow: hidden !important; }
  .mes { display: grid; grid-template-rows: auto repeat(var(--filas), minmax(0, 1fr)); gap: 4px; height: 100%; }
  .mes-dows, .mes-fila { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; min-height: 0; }
  .mes-dows span { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
  .celda {
    border: 1px solid var(--line); border-radius: 10px; padding: 4px 5px; overflow: hidden; min-height: 0;
    display: flex; flex-direction: column; gap: 2px; cursor: pointer;
  }
  .celda.fuera { opacity: .42; }
  .celda.hoy { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); background: var(--indigo-soft); }
  .celda .num { font-size: 13px; font-weight: 800; line-height: 1.2; }
  .celda.hoy .num { color: var(--indigo); }
  .celda .chip-t { font-size: 9.5px; padding: 1px 5px; border-radius: 5px; }
  .it { font-size: 11.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 4px; align-items: center; min-width: 0; }
  .it > span { overflow: hidden; text-overflow: ellipsis; }
  .it b { font-weight: 700; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .cuad { width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid var(--tarea); flex: none; }
  .hecha { opacity: .5; text-decoration: line-through; }
  .tag { font-style: normal; font-size: 8.5px; font-weight: 800; padding: 0 4px; border-radius: 4px; flex: none; letter-spacing: .03em; }
  .tag.egs { background: var(--src-egs-bg); color: var(--src-egs); }
  .tag.ag { background: var(--src-ag-bg); color: var(--src-ag); }
  .tag.casa { background: color-mix(in srgb, var(--area-otro) 18%, transparent); color: var(--area-otro); }
  .mas { font-size: 10.5px; color: var(--muted); font-weight: 600; }

  /* ── Semana ── */
  .semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; height: 100%; }
  .scol { border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .scol.hoy { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); }
  .scol-cab { padding: 8px 8px 6px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .scol-cab .num { font-size: 15px; font-weight: 800; }
  .scol-cab .chip-t { white-space: normal; font-size: 10.5px; }
  .scol-cab .num small { font-family: 'Inter', sans-serif; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; margin-right: 4px; }
  .scol.hoy .scol-cab .num { color: var(--indigo); }
  .scol-lista { overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
  .ficha { border-radius: 8px; padding: 5px 7px; font-size: 12.5px; line-height: 1.3; word-break: break-word; cursor: pointer; }
  .ficha b { display: block; font-size: 11px; opacity: .85; }
  .ficha.fh { background: var(--src-fh-bg); border-left: 3px solid var(--tarea); }
  .ficha.egs { background: var(--src-egs-bg); border-left: 3px solid var(--src-egs); }
  .ficha.casa { background: color-mix(in srgb, var(--area-otro) 14%, transparent); border-left: 3px solid var(--area-otro); }

  /* ── Día ── */
  /* ── Fin de semana y Compras ── */
  .finde { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; height: 100%; }
  .finde .scol-cab .num { font-size: 18px; }
  .finde .scol-cab .num small { font-size: 13px; }
  .finde .scol-lista { gap: 7px; padding: 8px; }
  .finde .ficha { font-size: 14.5px; padding: 9px 11px; }
  .finde .ficha b { display: inline; font-size: 13px; margin-right: 6px; }
  .finde-planes { font-size: 12.5px; font-weight: 800; color: var(--muted); margin-top: 8px; }
  .finde .hoy-fila .btn { height: 34px; min-width: 34px; padding: 0 8px; }
  .compras { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .compra { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; font-size: 13.5px; }
  .compra.hecha { opacity: .55; }
  .compra.hecha .compra-t { text-decoration: line-through; }
  .compra-ok { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; cursor: pointer; }
  .compra-t { flex: 1; min-width: 0; line-height: 1.3; word-break: break-word; }
  .compra-t small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; }
  .compra b { white-space: nowrap; }
  .fila-borra { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--atr-fecha); font-size: 14px; cursor: pointer; }
  .hoy-card .compra { margin: 0 0 6px; }
  .hoy-card .compra .quien { margin-right: 5px; vertical-align: 1px; }
  .gastos-mes { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  @media (max-width: 700px) { .finde { grid-template-columns: minmax(0, 1fr); height: auto; } }

  /* ── Viajes (cuaderno) y Vuelos ── */
  .vj-tira { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .vj-sel { flex: none; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left; }
  .vj-sel.on { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); background: var(--indigo-soft); }
  .vj-sel .e { font-size: 22px; }
  .vj-sel b { display: block; font-size: 14px; }
  .vj-sel small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .vj-portada { border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: linear-gradient(135deg, var(--indigo-soft), transparent 70%), var(--card); border: 1px solid var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .vj-portada .e { font-size: 42px; line-height: 1; }
  .vj-portada h3 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .vj-portada .sub { color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .vj-portada .notas { font-size: 13px; color: var(--muted); margin-top: 4px; max-width: 70ch; }
  .vj-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto; }
  .vj-pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--seg-bg); white-space: nowrap; }
  .vj-pill.aviso { background: var(--aviso-bg); color: var(--aviso-fg); }
  .vj-pill.ok { background: var(--ev-fitness-bg); color: var(--ev-fitness-fg); }
  .vj-dias { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; align-items: start; }
  .vj-dia { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .vj-dia.hoy { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); }
  .vj-dia-cab { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--col-bg); }
  .vj-dia-cab .n { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card); font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; font-size: 16px; flex: none; }
  .vj-dia.hoy .vj-dia-cab .n { background: var(--indigo); color: #fff; }
  .vj-dia-cab b { font-size: 14px; display: block; }
  .vj-dia-cab small { color: var(--muted); font-size: 12px; }
  .vj-lista { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .vj-it { display: flex; gap: 8px; align-items: flex-start; border-radius: 9px; padding: 7px 9px; font-size: 13px; line-height: 1.3; background: var(--col-bg); border-left: 3px solid var(--soft); }
  .vj-it.Ver { border-left-color: var(--ev-personal-dot); }
  .vj-it.Comer { border-left-color: var(--area-cocina); }
  .vj-it.Moverse { border-left-color: var(--ev-trip-dot); }
  .vj-it.Dormir { border-left-color: var(--ev-fitness-dot); }
  .vj-it .h { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 38px; color: var(--muted); }
  .vj-it .t { flex: 1; min-width: 0; word-break: break-word; }
  .vj-it .t b { font-weight: 700; }
  .vj-it .t small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .vj-it a.mapa { font-size: 11.5px; color: var(--indigo); font-weight: 600; text-decoration: none; }
  .vj-pod { margin-bottom: 10px; background: linear-gradient(135deg, var(--indigo-soft), transparent 70%), var(--card); }
  .vj-pod b { display: block; font-size: 14px; }
  .vj-pod small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .vj-pod audio { display: block; width: 100%; height: 40px; margin-top: 8px; }
  .vj-pod .vj-pod-it + .vj-pod-it { margin-top: 12px; }
  .vj-sin { font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px; background: var(--aviso-bg); color: var(--aviso-fg); margin-left: 4px; white-space: nowrap; }
  .vj-duermes { font-size: 12px; font-weight: 600; color: var(--ev-fitness-fg); background: var(--ev-fitness-bg); border-radius: 8px; padding: 6px 9px; }
  .vj-pend { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; }
  .vj-pend:first-of-type { border-top: 0; }
  .vj-pend .c { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--soft); display: grid; place-items: center; flex: none; font-size: 12px; }
  .vj-pend.hecho { color: var(--soft); text-decoration: line-through; }
  .vj-pend.hecho .c { background: var(--ev-fitness-dot); border-color: var(--ev-fitness-dot); color: #fff; }
  .vj-arriba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 10px; }
  .vj-caja { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .vj-caja h4 { font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
  .vu-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; align-items: start; }
  .vu { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--ev-trip-dot) 12%, transparent), transparent 60%); }
  .vu.prox { border-color: var(--ev-trip-dot); }
  .vu-cab { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: var(--muted); }
  .vu-cab .cuenta { background: var(--ev-trip-bg); color: var(--ev-trip-fg); padding: 3px 9px; border-radius: 999px; }
  .vu-ruta { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; }

  .vu-ruta .ap small { display: block; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .vu-ruta .linea { flex: 1; border-top: 2px dashed var(--ev-trip-dot); opacity: .7; }

  .vu-datos { display: flex; flex-wrap: wrap; gap: 5px; font-size: 12px; }

  .vu-salida { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; border-radius: 10px; padding: 10px 12px; background: var(--col-bg); }
  .vu-salida small { display: block; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .vu-salida b { font-family: 'Hanken Grotesk', sans-serif; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .vu-salida .casa b { color: var(--ev-fitness-fg); }
  .vu-salida .det { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
  .vu-billetes { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
  .vu-billete { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 9px; padding: 5px 6px 5px 10px; font-size: 13px; background: var(--card); }
  .vu-billete span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vu-billete .btn { height: 32px; min-width: 32px; padding: 0 10px; font-size: 13px; }
  .vu-sinbillete { font-size: 12px; color: var(--aviso-fg); background: var(--aviso-bg); border-radius: 8px; padding: 6px 9px; margin-top: 10px; }
  .vj-editar { font-size: 12.5px; font-weight: 700; color: var(--indigo); text-decoration: none; white-space: nowrap; }
  @media (max-width: 700px) { .vj-arriba { grid-template-columns: 1fr; } }
  /* Tareas EGS: las tareas de FileHub que empiezan por «EGS ·» (las apunta Carlos, Claude o el coordinador) */
  .eg-arriba { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; margin-bottom: 12px; }
  .eg-kpi { flex: 1 1 120px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card); min-width: 0; }
  .eg-kpi b { display: block; font-family: 'Hanken Grotesk', sans-serif; font-size: 28px; line-height: 1.05; }
  .eg-kpi small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .eg-kpi.rojo b { color: var(--prio-high); } .eg-kpi.ambar b { color: var(--prio-medium); } .eg-kpi.verde b { color: var(--src-egs); }
  .eg-nueva { flex: 1 1 170px; border: 1.5px dashed var(--src-egs); color: var(--src-egs); background: var(--src-egs-bg); border-radius: 12px; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; min-height: 64px; }
  .eg-barra { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: -4px 0 14px; }

  .eg-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }

  .eg-t { display: flex; gap: 8px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--prio-low)); border-radius: 10px; padding: 8px 8px 8px 10px; margin-bottom: 7px; cursor: pointer; }
  .eg-t .tx { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.3; word-break: break-word; }
  .eg-t .tema { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--src-egs); background: var(--src-egs-bg); border-radius: 6px; padding: 1px 6px; margin-bottom: 3px; }
  .eg-t .m { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
  .eg-t .m .venc { color: var(--atr-fecha); font-weight: 700; }
  .eg-t .m .curso { color: var(--indigo); font-weight: 700; }
  .eg-ok { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--src-egs); background: var(--card); color: var(--src-egs); font-size: 16px; font-weight: 800; cursor: pointer; }
  .eg-ok:hover { background: var(--src-egs-bg); }
  .eg-abajo { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; margin-top: 12px; }
  .eg-abajo .hoy-card h4 { margin: 0 0 4px; font-size: 13px; }
  .eg-hecha { text-decoration: line-through; color: var(--muted); }
  @media (max-width: 1000px) { .eg-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .eg-cols, .eg-abajo { grid-template-columns: minmax(0, 1fr); } }

  /* Pendientes CAP: lista propia de la consulta (nombre + qué hacer), tabla cap_pendientes */
  .cap-nueva { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto auto; gap: 8px; margin-bottom: 10px; }
  .cap-nueva input, .pr-subir input[type=text] { min-width: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-family: inherit; }
  .cap-nueva input:focus-visible, .pr-subir input:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .cap-nueva .btn { height: auto; min-height: 44px; font-weight: 800; }
  .cap-kpis { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 2px 10px; }
  .cap-kpis b { font-family: 'Hanken Grotesk', sans-serif; font-size: 20px; color: var(--ink); }
  .cap-kpis .rojo b { color: var(--prio-high); }
  .cap-kpis .priv { margin-left: auto; font-size: 12px; }
  .cap-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 8px; align-items: start; }
  .cap-fila { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--indigo); border-radius: 10px; padding: 9px 10px; cursor: pointer; min-width: 0; }
  .cap-fila.venc { border-left-color: var(--prio-high); }
  .cap-fila .tx { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .cap-fila .tx b { display: block; font-size: 15px; }
  .cap-fila .m { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .cap-fila .m .rojo { color: var(--atr-fecha); font-weight: 700; }
  .cap-fila .eg-ok { border-color: var(--indigo); color: var(--indigo); }
  .cap-fila.hecha .tx { text-decoration: line-through; color: var(--muted); }
  .cap-hechas { margin-top: 14px; }
  .cap-hechas summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); padding: 6px 2px; }
  .cap-hechas .cap-fila { margin-top: 6px; }
  @media (max-width: 700px) { .cap-nueva { grid-template-columns: minmax(0, 1fr) auto; } .cap-nueva input[name=tarea] { grid-column: 1 / -1; grid-row: 2; } .cap-nueva input[name=nombre] { grid-column: 1 / -1; } }
  /* Contactos: personas que Carlos va apuntando (él, Claude o Hermes), tabla contactos */
  .ct-barra { display: flex; gap: 8px; margin-bottom: 10px; }
  .ct-barra input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-family: inherit; }
  .ct-barra input:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .ct-barra .btn { height: auto; min-height: 44px; font-weight: 800; white-space: nowrap; }
  .ct-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; align-items: start; }
  .ct-fila { display: grid; gap: 5px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--indigo); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
  .ct-fila h4 { margin: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; line-height: 1.25; }
  .ct-fila .rol { font-size: 13px; color: var(--muted); line-height: 1.35; }
  .ct-fila .pq { font-size: 13.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ct-fila .sig { font-size: 13px; font-weight: 700; line-height: 1.35; }
  .ct-fila .sig.rojo { color: var(--atr-fecha); }
  .ct-fila .vias { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .ct-fila .vias a { font-size: 12.5px; font-weight: 700; text-decoration: none; color: var(--indigo); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ct-fila .m { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); }
  .ct-fila .etq { font-weight: 700; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .form textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-family: inherit; line-height: 1.4; resize: vertical; }
  /* Enlaces: las aplicaciones y webs de Carlos, a un toque (tabla enlaces), agrupadas */
  .el-grupo { margin-bottom: 14px; }
  .el-grupo > h4 { margin: 0 0 7px; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; display: flex; align-items: baseline; gap: 7px; }
  .el-grupo > h4 small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .el-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; align-items: stretch; }
  .el-tarjeta { display: flex; align-items: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-width: 0; overflow: hidden; }
  .el-tarjeta:hover, .el-tarjeta:focus-within { border-color: var(--indigo); }
  .el-tarjeta > a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 4px 10px 12px; min-height: 60px; color: var(--ink); text-decoration: none; }
  .el-tarjeta > a:focus-visible { outline: 2px solid var(--indigo); outline-offset: -2px; border-radius: 12px; }
  .el-tarjeta .ico { flex: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 20px; font-weight: 800; background: var(--indigo-soft); color: var(--indigo); }
  .el-tarjeta .txt { min-width: 0; display: grid; gap: 1px; }
  .el-tarjeta .txt b { font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
  .el-tarjeta .txt small { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .el-tarjeta .txt em { font-style: normal; font-size: 12.5px; line-height: 1.3; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .el-tarjeta .el-edit { flex: none; width: 44px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 15px; cursor: pointer; }
  .el-tarjeta .el-edit:hover, .el-tarjeta .el-edit:focus-visible { background: var(--indigo-soft); color: var(--ink); outline: none; }
  /* Anotaciones y documentos: lo de la carpeta «Anotaciones» del PC y lo que se sube aquí, por temas, con miniatura, visor y descarga */
  .an-temas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .an-temas button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .an-temas button.on { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .an-temas button:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  .an-temas small { font-weight: 600; opacity: .7; margin-left: 2px; }
  .an-grupo { margin-bottom: 18px; }
  .an-grupo h3 { font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; margin: 0 2px 8px; display: flex; align-items: baseline; gap: 8px; }
  .an-grupo h3 small { font-size: 12px; font-weight: 600; color: var(--muted); }
  .an-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; align-items: start; }
  .an-doc { display: grid; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
  .an-mini { all: unset; display: block; box-sizing: border-box; width: 100%; aspect-ratio: 4 / 5; position: relative; overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--line); cursor: pointer; }
  .an-mini img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .an-mini:focus-visible { outline: 2px solid var(--indigo); outline-offset: -2px; }
  .an-ico { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: .06em; color: var(--muted); }
  .an-tx { display: grid; gap: 6px; padding: 10px 12px 12px; min-width: 0; }
  .an-tx h4 { margin: 0; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .an-meta { font-size: 11.5px; color: var(--muted); }
  .an-acc { display: flex; gap: 6px; flex-wrap: wrap; }
  .an-acc .btn { flex: 1 1 auto; height: auto; min-height: 38px; padding: 0 8px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .an-acc .an-borra { flex: 0 0 38px; padding: 0; }
  .an-visor { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); }
  .an-visor[hidden] { display: none; }
  .an-barra { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; background: var(--card); border-bottom: 1px solid var(--line); }
  .an-barra b { flex: 1; min-width: 120px; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .an-barra span { font-size: 12px; color: var(--muted); }
  .an-barra .btn { height: 38px; font-size: 13px; font-weight: 700; }
  .an-hojas { flex: 1; overflow: auto; scrollbar-gutter: stable; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; justify-items: center; align-content: start; padding: 12px 8px 24px; }
  .an-hoja { max-width: 100%; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .25); }
  .an-hoja canvas { display: block; width: 100%; height: auto; }
  .an-espera { display: grid; gap: 12px; justify-items: center; padding: 40px 16px; color: var(--muted); font-size: 14px; text-align: center; }
  html.an-abierto, html.an-abierto body { overflow: hidden; }
  @media (max-width: 700px) { .an-lista { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .an-tx { padding: 8px 9px 10px; } .an-tx h4 { font-size: 13.5px; } .an-barra span { display: none; } }
  /* Proyectos: documentos propios agrupados por proyecto (tabla proyectos_docs + bucket privado «proyectos») */
  .pr-subir { border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; margin-bottom: 12px; }
  .pr-subir.encima { border-color: var(--indigo); background: var(--indigo-soft); }
  .pr-subir .fila { display: flex; gap: 8px; flex-wrap: wrap; }
  .pr-subir .fila input { flex: 1 1 220px; }
  .pr-subir .fila .btn { min-height: 44px; font-weight: 800; flex: 0 0 auto; }
  .pr-subir .ayuda { font-size: 12px; color: var(--muted); }
  .pr-msg { font-size: 13px; color: var(--muted); }
  .pr-msg.mal { color: var(--atr-fecha); }
  .pr-grupo { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--card); }
  .pr-grupo > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; min-height: 32px; }
  .pr-grupo > summary::-webkit-details-marker { display: none; }
  .pr-grupo > summary .n { font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; font-weight: 800; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .pr-grupo > summary .c { font-size: 12px; color: var(--muted); }
  .pr-doc { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .pr-grupo > summary + .pr-doc { margin-top: 8px; }
  .pr-doc .ico { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--indigo-soft); display: flex; align-items: center; justify-content: center; font-size: 21px; }
  .pr-doc .txt { flex: 1; min-width: 0; }
  .pr-doc .tt { font-size: 14.5px; font-weight: 700; overflow-wrap: anywhere; }
  .pr-doc .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pr-doc .notas { font-size: 12.5px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pr-doc .ops { display: flex; gap: 6px; flex: none; }
  .pr-doc .ops .btn { min-height: 40px; }
  @media (max-width: 560px) { .pr-doc { flex-wrap: wrap; } .pr-doc .ops { width: 100%; justify-content: flex-end; } }

  /* ── Incrustada en calendario.html (?solo=resumen): sin cabecera ni lateral ── */
  html.solo .top, html.solo .lateral, html.solo .vista-cab { display: none; }
  html.solo .app { padding: 0; height: 100dvh; min-height: 0; }
  html.solo .cuerpo { grid-template-columns: minmax(0, 1fr); height: 100%; }
  html.solo .vista { height: 100%; padding: 2px; border: 0; box-shadow: none; background: transparent; }
  html.solo, html.solo body { background: transparent; }

  /* ── Resumen: todo lo del día de un vistazo ── */
  #contenido > .hoy { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .hoy-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .hoy-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-height: 30px; }
  .hoy-cab h4 { font-size: 13px; font-weight: 800; flex: 1; }
  .hoy-cab .btn { height: 30px; min-width: 0; padding: 0 10px; font-size: 12px; }
  .hoy-fila { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.3; }
  .hoy-fila:first-of-type { border-top: 0; padding-top: 2px; }
  .hoy-fila > div { flex: 1; min-width: 0; word-break: break-word; }
  .hoy-fila a { color: inherit; font-weight: 600; }
  .hoy-fila small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .hoy-fila .btn { height: 28px; min-width: 0; padding: 0 8px; font-size: 12px; flex: none; }
  .hoy-mas { display: block; width: 100%; margin-top: 8px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; text-align: left; cursor: pointer; padding: 2px 0; }
  .hoy-card .ev-fila { margin-bottom: 6px; }
  .gastos-saldo { font-size: 15px; font-weight: 800; margin-bottom: 2px; }
  .hoy-card.horario { grid-column: 1 / -1; }
  .horario-dias { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .horario-dia { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.3; min-width: 0; }
  .horario-dia.es-hoy { border-color: var(--ink); border-width: 2px; }
  .horario-dia.pasado { opacity: .5; }
  .horario-dia b { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
  .horario-dia .h { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 800; margin-bottom: 5px; }
  .horario-dia span.q { display: block; word-break: break-word; }

// A qué hora estar en el aeropuerto y salir de casa (igual que el apartado Vuelos de FileHub).
const TRAYECTO_VU = { BCN: 45, RMU: 45, ALC: 50, OVD: 45, MAD: 50, VLC: 35, AGP: 35, SVQ: 30, PMI: 30, NRT: 90, HND: 45, KIX: 75, ITM: 40, NGO: 60 };

// ── Anotaciones y documentos: para leer, descargar y subir ───────────────────────────────────
// Se ven por temas (la subcarpeta), con la primera página de miniatura, un visor dentro de la página y el
// botón de descargar. Llegan por dos vías: lo que se guarda en la carpeta «Anotaciones» del PC aparece solo, y
// desde aquí se sube cualquier tipo de archivo (hasta 50 MB) al tema que se elija.
// Si pdf.js no carga (sin red, CDN bloqueado), no hay miniatura y «Ver» ofrece abrir el PDF en otra pestaña.
function anClave(a) { return `${a.ruta}|${a.updated_at || ''}`; }
function anEsPdf(a) { return /\.pdf$/i.test(a.nombre) || a.tipo === 'application/pdf'; }
function anTema(a) { return a.nombre.includes('/') ? a.nombre.split('/')[0] : 'General'; }

function anTitulo(a) { return anArchivo(a).replace(/\.[a-z0-9]{2,5}$/i, '').replace(/_/g, ' '); }
function anPaginas(n) { return n ? `${n} ${n === 1 ? 'página' : 'páginas'}` : ''; }
function anMiniGuardada(a) {
  const k = anClave(a);
  if (anMinis.has(k)) return anMinis.get(k);
  try { const v = JSON.parse(localStorage.getItem('fh_an_mini:' + k) || 'null'); if (v?.img) { anMinis.set(k, v); return v; } } catch {}
  return null;
}
// Las miniaturas guardadas de documentos que ya no están se borran, para no llenar el navegador.
function anLimpiaMinis() {
  const vivas = new Set(anotaciones.map(a => 'fh_an_mini:' + anClave(a)));
  try { for (const k of Object.keys(localStorage)) if (k.startsWith('fh_an_mini:') && !vivas.has(k)) localStorage.removeItem(k); } catch {}
}
async function anDescarga(a) {
  const k = anClave(a);
  if (anBytes.has(k)) return anBytes.get(k).slice(0); // pdf.js se queda con el búfer que recibe: se le da una copia
  let buf;
  if (a.demo_url) {
    const r = await fetch(a.demo_url);
    if (!r.ok) throw new Error('no está');
    buf = await r.arrayBuffer();
  } else {
    const { data, error } = await sb.storage.from(AN_ALMACEN).download(a.ruta);
    if (error) throw error;
    buf = await data.arrayBuffer();
  }
  if (buf.byteLength > 12 * 1024 * 1024) return buf; // los grandes no se guardan en memoria
  anBytes.set(k, buf);
  if (anBytes.size > 6) anBytes.delete(anBytes.keys().next().value);
  return buf.slice(0);
}
function anCargaPdfjs() {
  if (!anPdfjs) {
    anPdfjs = import(AN_PDFJS + 'legacy/build/pdf.min.mjs').then(m => {
      m.GlobalWorkerOptions.workerSrc = AN_PDFJS + 'legacy/build/pdf.worker.min.mjs';
      return m;
    }).catch(e => { anPdfjs = null; throw e; });
  }
  return anPdfjs;
}
async function anAbrePdf(a) {
  const pdfjs = await anCargaPdfjs();
  return pdfjs.getDocument({ data: new Uint8Array(await anDescarga(a)), cMapUrl: AN_PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: AN_PDFJS + 'standard_fonts/' }).promise;
}
async function anHazMini(a) {
  const doc = await anAbrePdf(a);
  try {
    const pag = await doc.getPage(1), base = pag.getViewport({ scale: 1 }), vp = pag.getViewport({ scale: 440 / base.width });
    const c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    await pag.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    const v = { img: c.toDataURL('image/jpeg', 0.8), paginas: doc.numPages };
    anMinis.set(anClave(a), v);
    try { localStorage.setItem('fh_an_mini:' + anClave(a), JSON.stringify(v)); } catch {}
    return v;
  } finally { doc.destroy(); }
}
function anPintaMini(a, v) {
  const h = document.querySelector(`#contenido .an-mini[data-pend="${CSS.escape(a.id)}"]`);
  if (!h) return;
  h.removeAttribute('data-pend');
  if (!v?.img) return;
  h.innerHTML = `<img src="${v.img}" alt="">`;
  const p = h.closest('.an-doc')?.querySelector('[data-anpag]');
  if (p && v.paginas) p.textContent = anPaginas(v.paginas) + ' · ';
}
// Las miniaturas que faltan se hacen de una en una y solo cuando su ficha está a la vista.
function anotMiniaturas() {
  anVigia?.disconnect();
  const huecos = [...document.querySelectorAll('#contenido .an-mini[data-pend]')];
  if (!huecos.length || !('IntersectionObserver' in window)) return;
  anVigia = new IntersectionObserver(entradas => {
    for (const e of entradas) {
      if (!e.isIntersecting) continue;
      anVigia.unobserve(e.target);
      const a = anotaciones.find(x => x.id === e.target.dataset.pend);
      if (!a) continue;
      anCola = anCola.then(() => anMiniGuardada(a) || anHazMini(a)).then(v => anPintaMini(a, v)).catch(() => { anFallidas.add(anClave(a)); anPintaMini(a, null); });
    }
  }, { rootMargin: '300px' });
  huecos.forEach(h => anVigia.observe(h));
}

  } catch {}
}

// Markdown sencillo del parte (negritas, cursivas, listas y títulos).
function md(txt) {
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(«])[*_](?!\s)(.+?)[*_](?=[\s).,:;!?»—-]|$)/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  let h = '', lista = false;
  for (const linea of String(txt).split(/\r?\n/)) {
    const l = linea.trim(), li = l.match(/^[-*•]\s+(.*)/);
    if (li) { if (!lista) { h += '<ul>'; lista = true; } h += `<li>${inline(li[1])}</li>`; continue; }
    if (lista) { h += '</ul>'; lista = false; }
    if (!l) continue;
    const tit = l.match(/^#{1,4}\s+(.*)/);
    h += tit ? `<h4>${inline(tit[1])}</h4>` : `<p>${inline(l)}</p>`;
  }
  return h + (lista ? '</ul>' : '');
}

const avisaFallo = (error, que) => alert(`No se pudo ${que}: ` + (esRedFallo(error?.message) ? 'sin conexión, inténtalo otra vez' : error?.message || 'error'));
async function escribe(tabla, fn, que) {
  if (DEMO) return true;
  const { error } = await conReintento(() => fn(sb.from(tabla)));
  if (error) { avisaFallo(error, que); return false; }
  return true;
}
async function accionCasa(id, acc) {
  const r = casa.find(x => x.id === id);
  if (!r) return;
  const esRut = r.kind === 'limpieza';
  if (acc === 'editar') return formRutina(r);
  if (acc === 'borrar') {
    if (!confirm(`¿Borrar «${r.title}»?`)) return;
    if (!(await escribe('casa_items', q => q.delete().eq('id', id), 'borrar'))) return;
    casa = casa.filter(x => x.id !== id);
  } else {
    let cambio;
    if (acc === 'hecha') {
      cambio = esRut ? { ultima_vez: HOY_S } : { done: true };
      // Turno alterno: al hacerla, la próxima le toca a la otra persona (como en la app Casa).
      if (esRut && r.categoria === 'alterna' && r.assignee !== 'ambos') cambio.assignee = r.assignee === 'carlos' ? 'montse' : 'carlos';
    } else if (acc === 'pendiente') cambio = esRut ? { ultima_vez: null } : { done: false };
    else if (acc.startsWith('asigna:')) cambio = { assignee: acc.slice(7) };
    else return;
    if (!(await escribe('casa_items', q => q.update({ ...cambio, updated_at: new Date().toISOString() }).eq('id', id), 'guardar'))) return;
    Object.assign(r, cambio);
  }
  cierraHoja(); render();
}
async function guardaRutina(id) {
  const title = campo('title'), cada = Math.min(365, Math.max(1, Math.round(Number(campo('cada_dias'))) || 7));
  const proxima = /^\d{4}-\d{2}-\d{2}$/.test(campo('proxima') || '') ? campo('proxima') : HOY_S;
  if (!title) { alert('Escribe qué hay que hacer.'); return; }
  const r = id ? casa.find(x => x.id === id) : null;
  // La app Casa calcula «toca» como última + cada: para que toque el día elegido, última = ese día − cada.
  const fila = { title, assignee: elegido('assignee') || 'ambos', categoria: elegido('categoria') || 'fijo', cada_dias: cada,
    ultima_vez: ymd(masDias(deYmd(proxima), -cada)), datos: { ...(r?.datos || {}), area: elegido('area') || 'limpieza' } };
  if (r) {
    if (!(await escribe('casa_items', q => q.update({ ...fila, updated_at: new Date().toISOString() }).eq('id', id), 'guardar'))) return;
    Object.assign(r, fila);
  } else {
    const nueva = { kind: 'limpieza', ...fila, created_by: emailSesion || null };
    if (DEMO) { casa.push({ id: 'c' + Date.now(), ...nueva, created_at: new Date().toISOString() }); }
    else {
      const { data, error } = await conReintento(() => sb.from('casa_items').insert(nueva).select(COLS_CASA).single());
      if (error) { avisaFallo(error, 'guardar'); return; }
      casa.push(data);
    }
  }
  cierraHoja(); render();
}

    return que === 'gasto' ? guardaGasto() : que === 'compra' ? guardaCompra() : que === 'tareafh' ? guardaTareaFH() : que === 'tareaegs' ? guardaTareaEGS() : que === 'tareacasa' ? guardaTareaCasa() : guardaRutina(s.dataset.id);

function cambiaVista(v) {
  // El fin de semana y los gastos se abren siempre en el actual, aunque vinieras de otro mes.
  const alActual = v !== vista && (v === 'finde' || v === 'gastos');
  vista = v; localStorage.setItem('fh_tab_vista', v);
  if (alActual) cursor = new Date(HOY);
  // El resumen es siempre de hoy: si estabas en otro mes, hay que volver a pedir sus datos.
  if ((v === 'hoy' || alActual) && !DEMO && rangoMes(HOY).desde !== mesCargado) { cursor = new Date(HOY); cargar(); return; }
  render();
}

$('contenido').addEventListener('click', e => {
  const t = e.target;
  // Pendientes CAP: ✓ marca (o desmarca); tocar la fila abre la ficha para editarla.
  const ck = t.closest('[data-capok]');
  if (ck) return marcaCap(ck.dataset.capok);
  const cf = t.closest('[data-cap]');
  if (cf) return hojaCap(cf.dataset.cap);
  // Anotaciones y documentos: subir, elegir tema, ver un documento (la miniatura también lo abre), descargarlo o borrarlo.
  if (t.closest('#anElegir')) { $('anArchivo')?.click(); return; }
  const ab = t.closest('[data-anborra]');
  if (ab) { const a = anotaciones.find(x => x.id === ab.dataset.anborra); if (a) borraAnot(a); return; }
  const at = t.closest('[data-antema]');
  if (at) { anFiltro = at.dataset.antema; if ($('anTemaNuevo')) $('anTemaNuevo').value = anFiltro; render(); return; }
  const av = t.closest('[data-anver], [data-anbajar]');
  if (av) { const a = anotaciones.find(x => x.id === (av.dataset.anver || av.dataset.anbajar)); if (a) { if (av.dataset.anbajar) anEnlace(a, true); else anVer(a); } return; }
  // Enlaces: la tarjeta es un enlace normal (se abre en otra pestaña); el lápiz abre la ficha para cambiarla.
  if (t.closest('#elNuevo')) return hojaEnlace(null);
  const ee = t.closest('[data-eledit]');
  if (ee) return hojaEnlace(ee.dataset.eledit);
  if (t.closest('.el-tarjeta > a')) return;
  // Contactos: el correo, el teléfono y el enlace se abren tal cual; tocar la ficha la abre para editarla.
  if (t.closest('.ct-fila .vias a')) return;
  if (t.closest('#ctNuevo')) return hojaContacto(null);
  const cn = t.closest('[data-ct]');
  if (cn) return hojaContacto(cn.dataset.ct);
  // Proyectos
  if (t.closest('#prElegir')) { $('prArchivo')?.click(); return; }
  const pa = t.closest('[data-pracc]');
  if (pa) { const d = prDocs.find(x => x.id === pa.closest('[data-prdoc]')?.dataset.prdoc); if (!d) return; const a = pa.dataset.pracc; return a === 'borrar' ? borraPr(d) : abrePr(d, a === 'bajar'); }
  const vs = t.closest('[data-vjsel]');
  if (vs) { viajeSel = vs.dataset.vjsel; localStorage.setItem('fh_tab_viaje', viajeSel); render(); return; }
  const vp = t.closest('[data-vjpend]');
  if (vp) return marcaPendViaje(vp.dataset.vjpend);
  const bi = t.closest('[data-billete]');
  if (bi) return abreBillete(bi.dataset.billete, Number(bi.dataset.j), bi.dataset.modo);
  if (t.closest('#encargarBtn')) return formEncargo();
  if (t.closest('#nuevaCompra')) return formCompra();
  if (t.closest('[data-ntfh]')) return formTareaFH();
  if (t.closest('[data-ntegs]')) return formTareaEGS();
  if (t.closest('[data-ntcasa]')) return formTareaCasa();
  // Botones ✓ y 🗑 de las filas: van antes que tocar la fila, que abre la ficha.
  const gb = t.closest('[data-gborra]');
  if (gb) return borraGasto(gb.dataset.gborra);
  const fo = t.closest('[data-fhok]');
  if (fo) { const x = [...pendientes, ...hechasFH, ...tareasMes, ...hechasEGS].find(y => String(y.id) === fo.dataset.fhok); return x && accionFH(x.id, x.completed ? 'hacer' : 'hecha'); }
  const fb = t.closest('[data-fhborra]');
  if (fb) return accionFH(fb.dataset.fhborra, 'borrar');
  const co = t.closest('[data-cok]');
  if (co) { const r = casa.find(x => x.id === co.dataset.cok); if (!r) return; hechasAhora.add(r.id); return accionCasa(r.id, r.done ? 'pendiente' : 'hecha'); }
  const cb = t.closest('[data-cborra]');
  if (cb) return accionCasa(cb.dataset.cborra, 'borrar');
  const cv = t.closest('[data-cver]');

// Tema: el mismo interruptor que el calendario (auto → claro → oscuro).
const TEMAS = ['auto', 'light', 'dark'], TEMA_ICONO = { auto: '🌗', light: '☀️', dark: '🌙' };
const mqOscuro = matchMedia('(prefers-color-scheme: dark)');
function aplicaTema() {
  const pref = localStorage.getItem('fh_cal_tema') || 'auto';
  const oscuro = pref === 'dark' || (pref === 'auto' && mqOscuro.matches);
  document.documentElement.dataset.tema = oscuro ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]').content = oscuro ? '#0b1326' : '#f4f6fa';
  $('temaBtn').textContent = TEMA_ICONO[pref];
}
$('temaBtn').onclick = () => {
  const pref = localStorage.getItem('fh_cal_tema') || 'auto';
  localStorage.setItem('fh_cal_tema', TEMAS[(TEMAS.indexOf(pref) + 1) % TEMAS.length]);
  aplicaTema();
};
mqOscuro.addEventListener?.('change', aplicaTema);

addEventListener('storage', e => { if (e.key === 'fh_cal_tema') aplicaTema(); });

  if (SOLO_RESUMEN) return; // mantener la pantalla encendida es cosa de la tablet, no del calendario
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !bloqueo) { bloqueo = await navigator.wakeLock.request('screen'); bloqueo.addEventListener('release', () => { bloqueo = null; }); } } catch { /* sin permiso: la tablet se apagará según sus ajustes */ }
}

// ── Se actualiza sola: cada despliegue cambia CACHE_VERSION en sw.js. Si cambia
// mientras el panel está abierto, se recarga con la versión nueva (salvo que haya
// una ficha abierta o estés escribiendo; entonces lo intenta en la siguiente vuelta).
let versionVista = null;
async function miraVersion() {
  if (DEMO || document.visibilityState !== 'visible') return;
  try {
    const txt = await (await fetch('/sw.js?v=' + Date.now(), { cache: 'no-store' })).text();
    const v = (txt.match(/CACHE_VERSION\s*=\s*'([^']+)'/) || [])[1];
    if (!v) return;
    if (versionVista === null) { versionVista = v; return; }
    if (v === versionVista) return;
    const ocupado = $('hoja')?.classList.contains('on') || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')
      || [...document.querySelectorAll('audio')].some(a => !a.paused && !a.ended);
    if (ocupado) return;
    await fetch(location.href, { cache: 'reload' }).catch(() => {});
    location.reload();
  } catch { /* sin conexión: se mira en la siguiente vuelta */ }
}
miraVersion();
setInterval(miraVersion, 5 * 60000);
// Recarga a distancia: una orden «recargar» por el canal fh-panel-control (la manda Claude tras publicar)
// recarga el panel al momento, sin esperar la vuelta de 5 min. Si hay una ficha abierta o estás escribiendo,
// lo vuelve a intentar a los 30 s. No lleva datos: solo recarga.
async function recargaCuandoPuedas() {
  const ocupado = $('hoja')?.classList.contains('on') || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if (ocupado) { setTimeout(recargaCuandoPuedas, 30000); return; }
  await fetch(location.href, { cache: 'reload' }).catch(() => {});
  location.reload();
}
sb.channel('fh-panel-control').on('broadcast', { event: 'recargar' }, () => recargaCuandoPuedas()).subscribe();
